---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app frigate
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: *app
          securityContext:
            # uid 0 is what the image is built for: s6-applyuidgid calls
            # setgroups(), so every s6-log crash-loops under any other uid
            # unless that binary is shimmed. Running root here is deliberate --
            # the kopiur mover is the thing kept unprivileged, via KOPIUR_UID.
            runAsNonRoot: false
            # Not for frigate, which is root and ignores it, but for the mover:
            # it runs as 65534 and can only back up /config if the files frigate
            # writes carry a group it shares.
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          # Frigate's documented YOLOv9 export, run only while the file is
          # missing from the config PVC. Delete the file to rebuild it.
          model:
            image:
              repository: docker.io/library/python
              # 3.11 is the newest Python with onnx-simplifier 0.4 wheels;
              # on 3.12+ pip builds it from source.
              tag: 3.11.18-bookworm@sha256:84fa927127b46670e768371d1ad1be271d57ba93a6fbb3479045c7c6c452432f
            command: ["/bin/sh", "-ec"]
            args:
              - |
                out=/config/model_cache/yolov9-s-320.onnx
                [ -f "$out" ] && exit 0
                git clone https://github.com/WongKinYiu/yolov9.git /tmp/yolov9
                cd /tmp/yolov9
                git checkout 5b1ea9a8b3f0ffe4fe0e203ec6232d788bb3fcff
                python3 -m venv /tmp/venv
                . /tmp/venv/bin/activate
                # CPU wheels first, or requirements.txt pulls ~3 GB of CUDA.
                pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
                # Headless OpenCV, so there's no libGL to apt-get as root.
                grep -v '^opencv-python' requirements.txt > /tmp/requirements.txt
                pip install --no-cache-dir -r /tmp/requirements.txt opencv-python-headless onnx==1.18.0 onnxruntime 'onnx-simplifier==0.4.*' onnxscript
                curl -fsSLo yolov9-s.pt https://github.com/WongKinYiu/yolov9/releases/download/v0.1/yolov9-s-converted.pt
                sed -i "s/ckpt = torch.load(attempt_download(w), map_location='cpu')/ckpt = torch.load(attempt_download(w), map_location='cpu', weights_only=False)/g" models/experimental.py
                python3 export.py --weights ./yolov9-s.pt --imgsz 320 --simplify --include onnx
                mkdir -p "$(dirname "$out")"
                # Rename last, so a failed copy never leaves a file that skips the export.
                cp yolov9-s.onnx "$out.tmp"
                mv "$out.tmp" "$out"
            env:
              HOME: /tmp
            # model_cache is owned by 65534 and not group-writable.
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              limits:
                memory: 4Gi
        containers:
          *app :
            image:
              repository: ghcr.io/blakeblackshear/frigate
              # Frigate's config migrator can't write the read-only configmap
              # mount: after a tag bump that changes the config schema, port the
              # migration into configmap.yaml by hand.
              tag: 0.18.2
            env:
              TZ: "${TIMEZONE}"
            # Every key is already named for the {FRIGATE_*} placeholder it
            # fills in config.yml, so no per-camera mapping is needed.
            envFrom:
              - secretRef:
                  name: frigate-secret
              # Optional so recording never waits on the AI stack; reloader's
              # reloadOnCreate restarts frigate once reflector mirrors it in.
              - secretRef:
                  name: frigate-llm-key
                  optional: true
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: "2"
                memory: 2Gi
              limits:
                # Frigate itself peaked ~5.1Gi before the large Jina and face
                # models; the cache and dshm tmpfs mounts below are charged
                # here too.
                memory: 10Gi
              claims:
                - name: gpu
    service:
      *app :
        ports:
          http:
            # 8971, never 5000: on 5000 roles aren't enforced and every request
            # is treated as admin.
            port: &port 8971
    route:
      *app :
        hostnames:
          - &host "frigate.${DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
            # Reaching this route means pocket-id already authenticated the
            # request, so grant the role frigate maps to admin. `set`, not
            # `add`, so a client-supplied value is overwritten rather than
            # appended.
          - filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  set:
                    - name: x-forwarded-groups
                      value: frigate-admins
            backendRefs:
              - identifier: *app
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        name: frigate-config
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
      # Recordings and snapshots. The export all_squash's to 4011, so the
      # pod's root uid never reaches the NAS -- ownership there is fixed.
      media:
        type: nfs
        server: storage.lan
        path: /mnt/hot/nvr
        globalMounts:
          - path: /media/frigate
      # tmpfs, so charged to the memory limit above. Segments wait here before
      # moving to /media; ~100 MB steady state.
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp/cache
      # ~3.4 MB per camera at 640x360; 512Mi covers all 16 with room over.
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        globalMounts:
          - path: /dev/shm

    externalSecrets:
      *app :
        refreshInterval: 1h
        refreshPolicy: Periodic
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword
        target:
          name: frigate-secret
          creationPolicy: Owner
          deletionPolicy: Retain
          template:
            type: Opaque
            mergePolicy: Replace
        # The 1Password fields are named for the env vars config.yml interpolates, so
        # every key passes straight through to envFrom with no mapping.
        dataFrom:
          - extract:
              key: k8s-nvr-frigate-secret
