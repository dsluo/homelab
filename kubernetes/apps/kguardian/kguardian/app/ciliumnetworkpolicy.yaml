---
# The chart's own NetworkPolicy (broker.networkPolicy) covers the broker only,
# and llm-bridge is the pod holding the LiteLLM virtual key and, at /mcp,
# cluster telemetry. /mcp is reached either through the ToolHive proxy below or
# by `kubectl port-forward`, which arrives from the node and is admitted by the
# host rule rather than by a pod rule.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kguardian-llm-bridge
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kguardian-llm-bridge
  ingress:
    # Kubelet probes, as in components/oidc/envoy.
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
        - health
    # The browser reaches the assistant through the frontend's /llm-api proxy,
    # never directly, so the gateway needs no rule of its own here.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kguardian
            app.kubernetes.io/name: kguardian-frontend
    # The ToolHive remote proxy fronting /mcp. Labels are the operator's own
    # (`app.kubernetes.io/name` is the kind, not the CR), so the instance label
    # is what pins this to the kguardian proxy rather than every proxy in ai.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: mcpremoteproxy
            app.kubernetes.io/instance: kguardian
