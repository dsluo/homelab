---
name: "Flux Reconcile"

on:
  push:
    branches: ["main"]
    paths: ["kubernetes/**"]

# Each push cancels the pending run, so a burst of merges triggers one reconcile.
concurrency:
  group: flux-reconcile
  cancel-in-progress: true

jobs:
  flux-reconcile:
    name: Flux Reconcile
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Debounce
        run: sleep 60

      - name: Trigger Receiver
        env:
          FLUX_WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
          FLUX_WEBHOOK_TOKEN: ${{ secrets.FLUX_WEBHOOK_TOKEN }}
        run: |
          body='{"ref":"${{ github.sha }}"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$FLUX_WEBHOOK_TOKEN" -hex | awk '{print $NF}')
          curl -fsS -X POST "$FLUX_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Signature: sha256=$sig" \
            -d "$body"
