---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bazarr
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 4009
            runAsGroup: 4009
            supplementalGroups: [5001]
            fsGroup: 4009
            fsGroupChangePolicy: OnRootMismatch
        containers:
          *app :
            image:
              repository: ghcr.io/home-operations/bazarr
              tag: 1.6.1@sha256:e5d192a6f62a4f2336b40e1021fb3e31acfeb125ba970b65bcf6d607e29146cf
            env:
              TZ: America/Detroit
              BAZARR__PORT: &port 6767
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 1Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
    service:
      *app :
        ports:
          http:
            port: *port
    route:
      *app :
        hostnames:
          - &host "bazarr.${DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: *app
                port: *port
      api:
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - identifier: *app
                port: *port
    persistence:
      config:
        existingClaim: *app
      media:
        type: nfs
        server: storage.lan
        path: /mnt/warm/media
      cache:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /config/cache
            subPath: cache
          - path: /config/log
            subPath: log

    externalSecrets:
      *app :
        refreshInterval: 1h
        refreshPolicy: Periodic
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword
        target:
          name: bazarr-secret
          creationPolicy: Owner
          deletionPolicy: Retain
          template:
            type: Opaque
            mergePolicy: Replace
            data:
              password: '{{ index . "password" }}'
        dataFrom:
          - extract:
              key: k8s-media-bazarr-secret
