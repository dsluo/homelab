---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencode-litellm-key
spec:
  # Governs the copy in 1Password, not the k8s Secret. Retain is ExternalSecret
  # vocabulary (target.deletionPolicy); PushSecret only accepts Delete/None.
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: opencode-litellm-key
  data:
    - match:
        remoteRef:
          remoteKey: k8s-ai-opencode-litellm-key
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          fieldType: concealed
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: pi-litellm-key
spec:
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: pi-litellm-key
  data:
    - match:
        remoteRef:
          remoteKey: k8s-ai-pi-litellm-key
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          fieldType: concealed
---
# Home Assistant runs outside the cluster (homeassistant.lan), so the key is
# delivered by hand out of 1Password rather than reflected into a namespace.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: home-assistant-litellm-key
spec:
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: home-assistant-litellm-key
  data:
    - match:
        remoteRef:
          remoteKey: k8s-ai-home-assistant-litellm-key
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          fieldType: concealed
