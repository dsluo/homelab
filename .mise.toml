[env]
'_'.file = { path = ".env" }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_CMD = "op read 'op://homelab/kube age key/password'"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
# utilities
"aqua:casey/just" = "1.58.0"
"aqua:jqlang/jq" = "1.8.1"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:google/go-containerregistry" = "0.22.0"
# talos
"aqua:budimanjojo/talhelper" = "3.1.17"
"aqua:siderolabs/talos" = "1.13.9"
# k8s
"aqua:derailed/k9s" = "0.51.0"
"cargo:sofka" = "0.18.3"
"aqua:helm/helm" = "4.2.4"
"aqua:helmfile/helmfile" = "1.7.4"
"aqua:kubernetes-sigs/kustomize" = "5.8.0"
"aqua:kubernetes/kubectl" = "1.34.3"
"aqua:kubecolor/kubecolor" = "0.7.1"
# app clis
"aqua:cilium/cilium-cli" = "0.20.0"
"aqua:cloudflare/cloudflared" = "2026.8.3"
"github:cloudnative-pg/cloudnative-pg" = "1.30.0"
"github:home-operations/kopiur" = "0.10.6"
"aqua:kopia/kopia" = "0.23.1"
"aqua:cilium/hubble" = "1.19.4"
# flux
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:getsops/sops" = "3.13.3"
"github:home-operations/flate" = "0.6.2"
# authoring tools
"pipx:copier" = { version = "9.17.2", uvx_args = "--with copier-template-extensions" }
# iac
"aqua:gruntwork-io/terragrunt" = "1.1.4"
"aqua:opentofu" = "1.12.6"
"aqua:opentofu/tofu-ls" = "0.5.3"
# ai/mcp
"github:grafana/mcp-grafana" = "1.3.0"
"pipx:unifi-network-mcp" = "0.29.0"
"pipx:unifi-protect-mcp" = "0.7.7"
