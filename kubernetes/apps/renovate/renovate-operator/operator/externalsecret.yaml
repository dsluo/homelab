---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-valkey
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-valkey
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      mergePolicy: Replace
      data:
        # Must match valkey.auth.aclUsers.default.passwordKey. Left at the
        # chart default, the valkey pod reads `default` while the operator
        # reads `default-password` from this same Secret, and valkey refuses
        # every connection.
        default-password: '{{ index . "default-password" }}'
  dataFrom:
    - extract:
        key: k8s-renovate-renovate-valkey
