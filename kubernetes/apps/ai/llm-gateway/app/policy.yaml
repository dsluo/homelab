---
# One policy on purpose: separate AgentgatewayPolicies on the same Gateway can
# overwrite each other while both still report Accepted.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-gateway
  traffic:
    apiKeyAuthentication:
      mode: Strict
      # The -llm-apikey Secrets from components/llm-key.
      secretSelector:
        matchLabels:
          llm-gateway/apikey: "true"
    authorization:
      action: Require
      policy:
        matchExpressions:
          # An empty models list allows everything, matching the litellm
          # virtual keys this replaces.
          - 'request.method != "POST" || size(apiKey.models) == 0 || json(request.body).model in apiKey.models'
  frontend:
    metrics:
      attributes:
        add:
          - name: user_id
            expression: apiKey.user_id
