---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
  - ./runtimeclass.yaml
configMapGenerator:
  - name: hermes-managed-config
    files:
      - ./resources/config.yaml
generatorOptions:
  disableNameSuffixHash: true
