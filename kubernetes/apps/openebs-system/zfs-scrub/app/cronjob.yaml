---
# One CronJob per node: zpool only sees the pools imported on its own host.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zfs-scrub-talos0
spec:
  schedule: "0 4 1 * *"
  timeZone: "${TIMEZONE}"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # A retry would start a second full scrub.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: talos0
          containers:
            - name: scrub
              image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
              # Fails (KubeJobFailed) if a scrub errors or any pool on the node isn't clean.
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Log pool status on every exit, including a failed scrub.
                  trap 'chroot /host /usr/local/sbin/zpool status -v' EXIT
                  chroot /host /usr/local/sbin/zpool list -H -o name | xargs chroot /host /usr/local/sbin/zpool scrub -w
                  chroot /host /usr/local/sbin/zpool status -x | grep -qx 'all pools are healthy'
              # chroot into the host to run its zpool against /dev/zfs.
              securityContext:
                privileged: true
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: host
                  mountPath: /host
                  readOnly: true
          volumes:
            - name: host
              hostPath:
                path: /
