---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: qwen3-embedding-0-6b
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            # Shared, not reserving: jellyfin, frigate and orcaslicer hold their
            # own claims on the single iGPU. Requires the ai namespace's
            # resource.kubernetes.io/admin-access label.
            adminAccess: true
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-embedding-0-6b
spec:
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  sourceSecretRef:
    name: llmkube-hf-secret
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: intel
    gpu:
      enabled: true
      vendor: intel
      layers: 999
      # count unset: any value >0 also adds an extended-resource limit that no
      # node advertises.
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: qwen3-embedding-0-6b
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-embedding-0-6b
spec:
  modelRef: qwen3-embedding-0-6b
  runtime: llamacpp
  # SYCL build. The operator has no default Intel image, so this is required.
  image: ghcr.io/ggml-org/llama.cpp:server-intel-b11429@sha256:3353d968ed8987612b7859828d14d205413567baafed00a90d71d0c23e63d7ba
  replicas: 1
  # llama.cpp splits contextSize across parallelSlots, so per-slot ctx =
  # contextSize / parallelSlots = 8192 / 2 = 4096 tokens/slot. memini v0.5.0
  # dropped its MEMINI_EMBED_MAX_ITEM_CHARS guard and embeds item content
  # un-truncated, so this per-slot ctx (and the uBatchSize below) is now the
  # only bound on embeddable item size — an item over ~4096 tokens (~16k chars)
  # fails the pooled-embedding ubatch rather than being truncated. Size for the
  # largest item memini is expected to embed. Total ctx unchanged, so CPU/KV
  # memory is too.
  contextSize: 8192
  # Pooled embeddings must fit the whole sequence in one ubatch, so keep this
  # >= per-slot ctx (4096) — otherwise a long input fits the context but not a
  # single micro-batch.
  uBatchSize: 4096
  parallelSlots: 2
  extraArgs:
    # Each pooled prompt saved ~68 MiB of slot state against an 8192 MiB
    # default ceiling — unbounded next to any limit set below, and embedding a
    # chunk once has no prefix to reuse.
    - --cache-ram
    - "0"
    - --embeddings
    - --pooling
    - last
    - --alias
    - Qwen/Qwen3-Embedding-0.6B
  resources:
    cpu: "500m"
    # llama.cpp fits itself to host RAM (63 GiB), not the cgroup: it projects
    # 2708 MiB here, over the 2Gi this carried before.
    memory: 4Gi
  endpoint:
    port: 8080
    type: ClusterIP
