---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./agentgatewayparameters.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./gateway.yaml
  - ./httproute.yaml
  - ./keystore.yaml
  - ./models
  - ./policy.yaml
  - ./service.yaml
  - ./usergroup.yaml
components:
  - ../../../../components/oidc/envoy
patches:
  # The proxy serves in-cluster consumers directly, so it cannot be
  # envoy-only; ./ciliumnetworkpolicy.yaml gates just the UI port. Matched by
  # regex because the name still holds an unsubstituted ${APP} here.
  - patch: |
      $patch: delete
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: envoy-only
    target:
      kind: CiliumNetworkPolicy
      name: .*-envoy-only
