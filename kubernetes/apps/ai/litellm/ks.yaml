---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/operator
  dependsOn:
    - name: external-secrets-config
      namespace: external-secrets
    # Kept after autoRegister was turned off, where it used to be load-bearing
    # (the flag resolves once at operator startup, so racing the llmkube CRDs
    # disabled it for the life of the pod). Now it only orders the backing
    # Services ahead of the proxy that publishes models pointing at them —
    # the proxy Kustomization depends on this one, so the ordering carries.
    - name: llmkube
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  # The proxy below is admitted by a validating webhook whose serving cert the
  # operator self-manages, so applying a LiteLLMProxy early fails admission
  # outright rather than merely "CRD not found".
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
spec:
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/proxy
  components:
    - ../../../../components/database
    - ../../../../components/kopiur
    - ../../../../components/oidc
  dependsOn:
    - name: external-secrets-config
      namespace: external-secrets
    - name: kopiur-repository
      namespace: kopiur-system
    - name: litellm-operator
    - name: pocket-id
      namespace: security
  postBuild:
    substitute:
      APP: *app
      APP_ICON_URL: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/litellm.svg"
      OIDC_APP_NAME: LiteLLM
      OIDC_CALLBACK_PATH: /sso/callback
      # The PVC holds one file: the ChatGPT OAuth auth.json (../proxy/proxy.yaml).
      # Small, but backed up on purpose — the only way to recreate it is another
      # interactive device-code login, so a lost volume otherwise costs a
      # 15-minute blocked request and a trip to auth.openai.com.
      KOPIUR_CAPACITY: 1Gi
      # Match the -non_root image's runtime identity (../proxy/proxy.yaml), so
      # the movers write the restored auth.json as the uid that refreshes it in
      # place. These also carry the volume's permissions on their own: the proxy
      # pod gets no fsGroup, because the CRD has no securityContext to put one
      # in, so the mover's fsGroup is the only thing that makes a fresh volume
      # writable — it leaves the root group-owned by KOPIUR_GID at 0775, and a
      # bare zfspv volume is otherwise root:root 0755. Verified on the
      # deploy-or-restore path too: the populator applies the fsGroup even when
      # no snapshot exists yet.
      KOPIUR_UID: "65534"
      KOPIUR_GID: "65534"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
