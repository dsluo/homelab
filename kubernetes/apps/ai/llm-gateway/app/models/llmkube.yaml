---
# Client-facing names are namespaced by backend (provider name + llama.cpp
# --alias). The model transformation is the string forwarded upstream. For the
# router-proxy entries it matters: BackendNameMatch picks the backend by it, so
# it must equal the ModelRouter backend name
# (../../../llmkube/models/modelrouter.yaml).
#
# Custom with Completions only, so Responses/Messages clients get translated
# to chat completions instead of hitting paths llama.cpp does not serve.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: llmkube-qwen3-8-27b-mtp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-gateway
      sectionName: http
  match:
    model: llmkube/Qwen/Qwen3.8-27B-MTP
  provider: Custom
  # The router-proxy, not the Service: qwen is a ModelPool member, and the
  # proxy is what makes a non-resident member resident before dispatching.
  baseURL: http://inference-router-proxy.ai.svc.cluster.local:8080/v1
  custom:
    formats:
      - type: Completions
  policies:
    transformations:
      - field: model
        expression: '"qwen3-8-27b-mtp"'
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: llmkube-qwen3-8-flash-next
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-gateway
      sectionName: http
  match:
    model: llmkube/Qwen/Qwen3.8-Flash-Next
  provider: Custom
  baseURL: http://inference-router-proxy.ai.svc.cluster.local:8080/v1
  custom:
    formats:
      - type: Completions
  policies:
    transformations:
      - field: model
        expression: '"qwen3-8-flash-next"'
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: llmkube-qwen3-embedding-0-6b
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-gateway
      sectionName: http
  match:
    model: llmkube/Qwen/Qwen3-Embedding-0.6B
  provider: Custom
  baseURL: http://qwen3-embedding-0-6b.ai.svc.cluster.local:8080/v1
  custom:
    formats:
      - type: Embeddings
  policies:
    transformations:
      - field: model
        expression: '"qwen3-embedding-0-6b"'
      # kritika sends `dimensions`; llama.cpp returns the native 1024
      # regardless. A failed expression removes the field.
      - field: dimensions
        expression: 'fail("remove")'
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: llmkube-qwen3-reranker-0-6b
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-gateway
      sectionName: http
  match:
    model: llmkube/Qwen/Qwen3-Reranker-0.6B
  provider: Custom
  baseURL: http://qwen3-reranker-0-6b.ai.svc.cluster.local:8080
  custom:
    formats:
      # Sent as written (baseURL's path is not prepended). llama.cpp
      # --reranking serves the Cohere-style body here.
      - type: Rerank
        path: /v1/rerank
  policies:
    transformations:
      - field: model
        expression: '"qwen3-reranker-0-6b"'
