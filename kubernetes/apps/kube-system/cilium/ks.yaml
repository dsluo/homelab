---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/kube-system/cilium/app
  postBuild:
    substituteFrom:
      - name: cluster-global-config
        kind: ConfigMap
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  wait: false
---
# Split from the CNI's Kustomization because these need the Pocket-ID and
# grafana-operator CRDs, and Flux applies a Kustomization as a set — a missing
# CRD here would otherwise block cilium itself.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hubble
spec:
  dependsOn:
    - name: cilium
    - name: pocket-id
      namespace: security
    # Both are wait: false, so this orders the apply, it doesn't guarantee
    # the CRDs are established.
    - name: grafana-operator
      namespace: observability
  components:
    - ../../../../components/oidc/envoy
  interval: 1h
  path: ./kubernetes/apps/kube-system/cilium/hubble
  postBuild:
    substitute:
      APP: *app
      # The workload this Kustomization fronts is hubble-ui, deployed by the
      # cilium chart next door; ${APP} is `hubble` for the OIDC client's sake.
      # components/oidc/envoy's default-deny needs the pod's real name label.
      NETPOL_APP: hubble-ui
      OIDC_APP_NAME: Hubble
      APP_ICON_URL: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/cilium.svg"
    substituteFrom:
      - name: cluster-global-config
        kind: ConfigMap
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  wait: false
