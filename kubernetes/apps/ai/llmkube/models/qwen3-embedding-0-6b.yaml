---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-embedding-0-6b
spec:
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  sourceSecretRef:
    name: llmkube-hf-secret
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
    gpu:
      enabled: false
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-embedding-0-6b
spec:
  modelRef: qwen3-embedding-0-6b
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-b11889@sha256:5741ab30aae42af23ca57d9b98a6d4544cb09c21f372f92c5ee55312fa8b8b0c
  replicas: 1
  # CPU-only; kept off talos1 so its RAM goes to flash-next's CPU-side experts.
  nodeSelector:
    kubernetes.io/hostname: talos0
  # llama.cpp splits contextSize across parallelSlots, so per-slot ctx =
  # contextSize / parallelSlots = 8192 / 2 = 4096 tokens/slot. memini v0.5.0
  # dropped its MEMINI_EMBED_MAX_ITEM_CHARS guard and embeds item content
  # un-truncated, so this per-slot ctx (and the uBatchSize below) is now the
  # only bound on embeddable item size — an item over ~4096 tokens (~16k chars)
  # fails the pooled-embedding ubatch rather than being truncated. Size for the
  # largest item memini is expected to embed. Total ctx unchanged, so CPU/KV
  # memory is too.
  contextSize: 8192
  # Pooled embeddings must fit the whole sequence in one ubatch, so keep this
  # >= per-slot ctx (4096) — otherwise a long input fits the context but not a
  # single micro-batch.
  uBatchSize: 4096
  parallelSlots: 2
  extraArgs:
    # Each pooled prompt saved ~68 MiB of slot state against an 8192 MiB
    # default ceiling — unbounded next to any limit set below, and embedding a
    # chunk once has no prefix to reuse.
    - --cache-ram
    - "0"
    # One thread per P-core (even CPUs 0-14 on the 12700K); unpinned, threads
    # share HT siblings or land on E-cores and pp drops 25-30%.
    - --threads
    - "8"
    - --cpu-mask
    - "0x5555"
    - --cpu-strict
    - "1"
    - --embeddings
    - --pooling
    - last
    - --alias
    - Qwen/Qwen3-Embedding-0.6B
  resources:
    # Matches --threads so CFS weight backs all 8 under contention.
    cpu: "8"
    # Climbs to 3Gi+ on memini's backlog and OOMKilled at 3Gi; iGPU runs
    # peaked near 5.4Gi.
    memory: 6Gi
  endpoint:
    port: 8080
    type: ClusterIP
