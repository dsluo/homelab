---
# The key llm-gateway presents to the proxy. Its one entry is named for
# agentgateway's auth.secretRef (./models.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi-key
spec:
  # CreatedOnce: the generator mints a fresh key on every refresh.
  refreshPolicy: CreatedOnce
  target:
    name: cliproxyapi-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      mergePolicy: Replace
      data:
        Authorization: '{{ index . "password" }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: llm-key
---
# The proxy has no env override for its client keys, so the whole config is
# templated here, reading the key back through llm-gateway's store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi-config
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: SecretStore
    name: llm-keys
  target:
    name: cliproxyapi-config
    creationPolicy: Owner
    template:
      type: Opaque
      mergePolicy: Replace
      data:
        # Mounted read-only: an empty management secret-key disables the
        # management API, which is also what keeps the proxy from rewriting
        # this file on startup. Logins go through the CLI instead (README.md).
        config.yaml: |
          config-version: 8
          server:
            port: 8317
          management:
            secret-key: ""
            disable-control-panel: true
          access:
            api-keys:
              - "{{ .key }}"
          oauth:
            auth-dir: /data/auths
  data:
    - secretKey: key
      remoteRef:
        key: cliproxyapi-key
        property: Authorization
