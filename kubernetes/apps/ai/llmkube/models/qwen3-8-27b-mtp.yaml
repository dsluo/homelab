---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8-27b-mtp
spec:
  # HF cache path models--unsloth--Qwen3.8-27B-GGUF / Qwen3.8-27B-UD-Q4_K_XL.gguf
  # Qwen3.8 folds the MTP (nextn) layer into the base GGUF, so there is no
  # separate -MTP-GGUF repo as there was for 3.6. Verified in the file's header:
  # qwen35.nextn_predict_layers=1 plus blk.64.nextn.* tensors. The --spec-type
  # draft-mtp flags below therefore still apply unchanged.
  source: https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q4_K_XL.gguf
  sourceSecretRef:
    name: llmkube-hf-secret
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: rocm
      layers: 999 # preset ngl=999 (full offload)
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: r9700
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b-mtp
spec:
  modelRef: qwen3-8-27b-mtp
  runtime: llamacpp
  # gfx1201 is in the upstream ROCm image's build targets.
  image: ghcr.io/ggml-org/llama.cpp:server-rocm-b11889@sha256:6ed4232c6467c82ec2f4997be3d5b32d5cd11de7b875aa704dd830c0ebd12ce6
  # No replicas: the ModelPool owns them, and a value here makes Flux fight it.

  # --- typed preset fields ---
  contextSize: 262144 # ctx-size
  parallelSlots: 2 # parallel
  batchSize: 2048 # batch-size
  uBatchSize: 512 # ubatch-size
  cacheTypeK: q8_0 # cache-type-k
  cacheTypeV: q8_0 # cache-type-v

  # --- preset flags without typed CRD fields (MTP draft, KV reuse, sampling) ---
  # Omitted from the preset: load-on-startup (router-only).
  extraArgs:
    - --alias
    - Qwen/Qwen3.8-27B
    - --verbosity
    - "4"
    - --cache-reuse
    - "256"
    - --kv-unified
    - --spec-type
    - draft-mtp
    - --spec-draft-n-max
    - "3"
    - --spec-draft-ngl
    - "999"
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    # Retained from 3.6, deliberately. Qwen3.6 documented two thinking-mode
    # presets -- 1.0 for general tasks and 0.6 for "precise coding tasks" -- and
    # we picked the coding one. Qwen3.8's model card lists only the general 1.0
    # and drops the coding preset, so 0.6 is now a local choice rather than an
    # upstream recommendation. Bump to 1.0 if outputs feel under-diverse.
    - --temp
    - "0.6"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0.0"
    - --presence-penalty
    - "0.0"
    - --repeat-penalty
    - "1.0"
    - --chat-template-kwargs
    - '{"preserve_thinking":true}'

  resources:
    cpu: "1"
    memory: 16Gi

  endpoint:
    port: 8080
    type: ClusterIP
