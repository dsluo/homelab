---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8-27b-mtp
spec:
  # HF cache path models--unsloth--Qwen3.8-27B-GGUF / Qwen3.8-27B-UD-Q4_K_XL.gguf
  # Qwen3.8 folds the MTP (nextn) layer into the base GGUF, so there is no
  # separate -MTP-GGUF repo as there was for 3.6. Verified in the file's header:
  # qwen35.nextn_predict_layers=1 plus blk.64.nextn.* tensors. The --spec-type
  # draft-mtp flags below therefore still apply unchanged.
  source: https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q4_K_XL.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 2 # 3090 Ti + 3070 on talos1
      vendor: nvidia
      layers: 999 # preset ngl=999 (full offload)
      # Emit a single --tensor-split 7,1. llmkube derives the ratio from the
      # layerSplit range sizes (7 vs 1), so we must NOT also pass --tensor-split
      # in extraArgs or llama.cpp gets it twice. The ranges only express the 7:1
      # proportion; they need not match the real layer count.
      #
      # 7:1, not the preset 6:1: this quant back-loads its bits, so the 3070 held
      # 20% of the weights at 6:1 (3209 MiB) and could not also fit the MTP draft
      # compute buffer. One layer less puts it back under the ~2920 MiB that fit.
      sharding:
        strategy: layer
        layerSplit:
          - "0-6" # 3090 Ti — 7 parts
          - "7-7" # 3070 — 1 part
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b-mtp
spec:
  modelRef: qwen3-8-27b-mtp
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10752@sha256:031c0058432ab0769057273cdfda45848d00fef11e993448eef98c7ebb45a8c6
  runtimeClassName: nvidia
  # No spec.replicas -- the ModelPool in ./modelpool.yaml owns a pooled member's
  # replica count, and a value here would make Flux fight the controller on a swap.

  # Negative priority (value -100) so games-on-whales Wolf streaming sessions
  # (default priority 0) preempt this pod and free a GPU on talos1. See
  # ./priorityclass.yaml and kubernetes/apps/games/games-on-whales/README.md.
  priorityClassName: gpu-preemptible

  # --- typed preset fields ---
  contextSize: 262144 # ctx-size
  parallelSlots: 2 # parallel
  batchSize: 2048 # batch-size
  uBatchSize: 256 # ubatch-size — halved from 512 to shrink the per-context
  # compute buffer on the 3070. The 3070 holds TWO compute buffers (main +
  # MTP draft context), allocated sequentially; at 512 (and even 384) the
  # second one OOMs. 256 is the ceiling that fits full 262144 ctx + MTP here.
  cacheTypeK: q8_0 # cache-type-k
  cacheTypeV: q8_0 # cache-type-v

  # --- preset flags without typed CRD fields (MTP draft, KV reuse, sampling) ---
  # Omitted from the preset: load-on-startup (router-only).
  # --tensor-split 6,1 is emitted by the Model's gpu.sharding (above), not here.
  extraArgs:
    - --alias
    - Qwen/Qwen3.8-27B
    - --verbosity
    - "4"
    - --cache-reuse
    - "256"
    - --kv-unified
    - --spec-type
    - draft-mtp
    - --spec-draft-n-max
    - "3"
    - --spec-draft-ngl
    - "999"
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    # Retained from 3.6, deliberately. Qwen3.6 documented two thinking-mode
    # presets -- 1.0 for general tasks and 0.6 for "precise coding tasks" -- and
    # we picked the coding one. Qwen3.8's model card lists only the general 1.0
    # and drops the coding preset, so 0.6 is now a local choice rather than an
    # upstream recommendation. Bump to 1.0 if outputs feel under-diverse.
    - --temp
    - "0.6"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0.0"
    - --presence-penalty
    - "0.0"
    - --repeat-penalty
    - "1.0"
    - --chat-template-kwargs
    - '{"preserve_thinking":true}'

  resources:
    cpu: "1"
    memory: 8Gi
    # Request BOTH physical GPUs on talos1 (no time-slicing -- the node
    # advertises exactly nvidia.com/gpu: 2). Holding both is what makes the
    # gpu-preemptible PriorityClass work: a games-on-whales session also needs 2
    # (wolf sidecar + app), so the node has zero free GPUs and the scheduler must
    # preempt this -100 pod to fit the session. (Time-slicing previously broke
    # this by inflating the node to 8 slices, so a session fit alongside qwen
    # without preempting -- see issue #1109.) Matches hardware.gpu.count + the
    # 6:1 --tensor-split above.
    gpu: 2

  endpoint:
    port: 8080
    type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen3-8-27b-mtp
spec:
  hostnames:
    - "qwen.${DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: qwen3-8-27b-mtp
          port: 8080
