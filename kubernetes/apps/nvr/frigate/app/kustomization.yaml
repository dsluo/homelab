---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./resourceclaimtemplate.yaml
  - ./usergroup.yaml
configMapGenerator:
  - name: frigate-config
    files:
      - ./resources/config.yml
  - name: frigate-export-requirements
    files:
      - ./resources/export-requirements.txt
generatorOptions:
  disableNameSuffixHash: true
