---
# ChatGPT subscription models: the plan's Codex backend, not the platform API
# (https://docs.litellm.ai/docs/providers/chatgpt). No published model list —
# verify a candidate with `codex exec -m <model> --skip-git-repo-check`.
# info is mandatory; the cost map cannot resolve chatgpt/* names. mode must stay
# responses — it is what bridges completion() to /responses, and the Codex
# backend serves nothing else. The UI health check 400s regardless (upstream
# #38085), which is cosmetic.
# Own Kustomization only so ../ks.yaml can gate these behind ../chatgpt-login:
# registering one before that Job writes auth.json crashloops the proxy,
# unrecoverably.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chatgpt-gpt-5-6-sol
spec:
  modelName: chatgpt/gpt-5.6-sol
  params:
    model: chatgpt/gpt-5.6-sol
  info:
    mode: responses
    maxInputTokens: 922000
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsVision: true
---
