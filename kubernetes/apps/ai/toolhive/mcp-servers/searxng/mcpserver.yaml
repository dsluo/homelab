---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: mcp-searxng
spec:
  image: docker.io/isokoliuk/mcp-searxng:2.2.0@sha256:b63f934ec0541e41ff8cf4756f6c4d75ab5f1ad2089996669c6b7aaff79ba1c9
  transport: streamable-http
  proxyPort: 8080
  env:
    - name: TZ
      value: America/Detroit
    - name: SEARXNG_URL
      value: http://searxng.ai.svc.cluster.local:8080
    - name: MCP_HTTP_PORT
      value: "8080"
    - name: MCP_HTTP_HOST
      value: "0.0.0.0"
    # Without this, Express keeps `trust proxy` off and express-rate-limit keys
    # every request by the socket peer — always the ToolHive proxy pod — so all
    # clients share one bucket and trip 429 (-32029) together. The pod CIDR
    # covers both hops (envoy-internal, ToolHive proxy) regardless of hop count.
    - name: MCP_HTTP_TRUST_PROXY
      value: "10.244.0.0/16"
    # Default is 20/min, which a couple of agents reconnecting can exhaust.
    - name: MCP_RATE_INIT_MAX
      value: "120"
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi
