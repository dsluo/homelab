---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mcp-hister
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-hister
  oidc:
    provider:
      issuer: https://pocket-id.${DOMAIN}
    clientID: hister-mcp
    clientSecret:
      name: hister-mcp-oidc-credentials
    redirectURL: https://hister-mcp.${DOMAIN}/oauth2/callback
    logoutPath: /logout
