---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: llm-key
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 48
      # No symbols: keys travel in Authorization headers and client configs.
      symbols: 0
      allowRepeat: true
---
# Lets components/llm-key read each generated raw key back out of this
# namespace to build the gateway's -llm-apikey Secret from it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-keys
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-keys
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-keys
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-keys
subjects:
  - kind: ServiceAccount
    name: llm-keys
---
# A token Secret rather than auth.serviceAccount: ESO's own RBAC cannot create
# serviceaccounts/token outside its namespace.
apiVersion: v1
kind: Secret
metadata:
  name: llm-keys-token
  annotations:
    kubernetes.io/service-account.name: llm-keys
type: kubernetes.io/service-account-token
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: llm-keys
spec:
  provider:
    kubernetes:
      remoteNamespace: ai
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        token:
          bearerToken:
            name: llm-keys-token
            key: token
