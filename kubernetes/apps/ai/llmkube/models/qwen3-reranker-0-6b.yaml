---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-reranker-0-6b
spec:
  # llama.cpp-packaged reranker build (rank head intact); serves memini's
  # /v1/rerank on CPU.
  source: https://huggingface.co/Voodisss/Qwen3-Reranker-0.6B-GGUF-llama_cpp/resolve/main/Qwen3-Reranker-0.6B-Q5_K_M.gguf
  sourceSecretRef:
    name: llmkube-hf-secret
  format: gguf
  quantization: Q5_K_M
  hardware:
    accelerator: cpu
    gpu:
      enabled: false
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-reranker-0-6b
spec:
  modelRef: qwen3-reranker-0-6b
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-b11889@sha256:5741ab30aae42af23ca57d9b98a6d4544cb09c21f372f92c5ee55312fa8b8b0c
  replicas: 1
  # CPU-only; kept off talos1 so its RAM goes to flash-next's CPU-side experts.
  nodeSelector:
    kubernetes.io/hostname: talos0
  contextSize: 8192
  # A rank pass needs the whole query+document in one ubatch, so keep this >=
  # per-slot ctx (8192 / 4); the 512 default 500s on longer documents.
  uBatchSize: 2048
  parallelSlots: 4
  # --reranking + --pooling rank exposes the Cohere-style /v1/rerank endpoint
  # memini calls.
  extraArgs:
    # The prompt cache saves 15-25 MiB per rerank against an 8192 MiB default
    # ceiling and OOMKilled the pod; distinct documents share no prefix.
    - --cache-ram
    - "0"
    - --reranking
    - --pooling
    - rank
    - --alias
    - Qwen/Qwen3-Reranker-0.6B
  resources:
    cpu: "500m"
    # llama.cpp fits itself to host RAM (63 GiB), not the cgroup, and projects
    # 1614 MiB here — it OOMKilled on the first rerank at 1Gi.
    memory: 2Gi
  endpoint:
    port: 8080
    type: ClusterIP
