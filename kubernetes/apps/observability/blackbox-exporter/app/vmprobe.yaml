---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/operator.victoriametrics.com/vmprobe_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: nfs
spec:
  # components/zeroscaler selects on this job name; renaming it scales every
  # NFS app to zero.
  jobName: nfs_probe
  module: tcp_connect
  vmProberSpec:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      targets:
        - storage.lan:2049
  interval: 15s
