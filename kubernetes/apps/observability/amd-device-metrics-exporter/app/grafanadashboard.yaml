---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: amd-gpu-overview
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: AMD GPU
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
    - datasourceName: __expr__
      inputName: DS_EXPRESSION
  # Renovate moves this tag with the chart (amd-device-metrics-exporter group).
  url: https://raw.githubusercontent.com/ROCm/device-metrics-exporter/v1.5.3/grafana/dashboard_overview.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: amd-gpu-node
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: AMD GPU
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
    - datasourceName: __expr__
      inputName: DS_EXPRESSION
  url: https://raw.githubusercontent.com/ROCm/device-metrics-exporter/v1.5.3/grafana/dashboard_node.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: amd-gpu-detail
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: AMD GPU
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
    - datasourceName: __expr__
      inputName: DS_EXPRESSION
  url: https://raw.githubusercontent.com/ROCm/device-metrics-exporter/v1.5.3/grafana/dashboard_gpu.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: amd-gpu-job
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: AMD GPU
  datasources:
    - datasourceName: VictoriaMetrics
      inputName: DS_PROMETHEUS
    - datasourceName: __expr__
      inputName: DS_EXPRESSION
  url: https://raw.githubusercontent.com/ROCm/device-metrics-exporter/v1.5.3/grafana/dashboard_job.json
