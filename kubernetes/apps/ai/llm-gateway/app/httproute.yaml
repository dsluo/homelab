---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-gateway
spec:
  hostnames:
    - "llm.${DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: llm-gateway
          port: 80
---
# The UI has no auth of its own; the SecurityPolicy from components/oidc/envoy
# attaches to this route by name and is the only gate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-gateway-ui
spec:
  hostnames:
    - "llm-ui.${DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: llm-gateway-ui
          port: 15000
