---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: mcp-searxng
spec:
  image: docker.io/isokoliuk/mcp-searxng:2.7.0@sha256:c018ec75ab6613d3bddd75add274049bbad9dc178fc6c4c35817db227398c100
  transport: streamable-http
  proxyPort: 8080
  env:
    - name: TZ
      value: "${TIMEZONE}"
    - name: SEARXNG_URL
      value: http://searxng.ai.svc.cluster.local:8080
    - name: MCP_HTTP_PORT
      value: "8080"
    - name: MCP_HTTP_HOST
      value: "0.0.0.0"
    # Without this, Express keeps `trust proxy` off and express-rate-limit keys
    # every request by the socket peer — always the ToolHive proxy pod — so all
    # clients share one bucket and trip 429 (-32029) together. The pod CIDR
    # covers both hops (envoy-internal, ToolHive proxy) regardless of hop count.
    - name: MCP_HTTP_TRUST_PROXY
      value: "10.244.0.0/16"
    # Default is 20/min, which a couple of agents reconnecting can exhaust.
    - name: MCP_RATE_INIT_MAX
      value: "120"
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi
