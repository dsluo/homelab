---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelPool
metadata:
  name: talos1-gpu
spec:
  # Informational: members declare their own resource claims. Flash-next takes
  # both R9700s, so it and the 27B cannot be resident at once.
  gpu: 2
  # Hands the cards back to flash-next once the 27B goes idle.
  swapPolicy: reclaim
  # Long enough to cover a pause in a 27B session; each reclaim cold-reads
  # 114 GiB to bring flash-next back.
  reclaimAfter: 30m
  # Caps how long the router holds a request while the incumbent drains and the
  # target cold-loads; past it the client gets 503 + Retry-After. Flash-next's
  # 114 GiB load is the long direction.
  swapBudget: 900s
  default: qwen3-8-flash-next
  members:
    - inferenceServiceRef:
        name: qwen3-8-flash-next
    - inferenceServiceRef:
        name: qwen3-8-27b-mtp
    - inferenceServiceRef:
        name: qwen3-8-27b-rad
