---
# A Secret rather than a ConfigMap: Flux substitutes the OIDC client secret in.
# Setting IMMICH_CONFIG_FILE makes the admin Settings page read-only.
apiVersion: v1
kind: Secret
metadata:
  name: immich-config
type: Opaque
stringData:
  immich.yaml: |
    backup:
      database:
        # pg_dumpall needs superuser; barman already backs up the database.
        enabled: false
    ffmpeg:
      accel: qsv
      accelDecode: true
    job:
      # Above Immich's defaults (3/1/2/2): ML runs on talos1's 32 threads and
      # thumbnails have talos0 to themselves.
      thumbnailGeneration:
        concurrency: 6
      ocr:
        concurrency: 4
      faceDetection:
        concurrency: 4
      smartSearch:
        concurrency: 4
    machineLearning:
      urls:
        - http://immich-machine-learning.photos.svc.cluster.local:3003
    newVersionCheck:
      enabled: false
    oauth:
      enabled: true
      autoRegister: true
      buttonText: Login with Pocket ID
      # Defaults let the first reconcile apply the PocketIDOIDCClient that
      # creates the credentials Secret; strict substitution fails it otherwise.
      clientId: "${OIDC_CLIENT_ID:=placeholder}"
      clientSecret: "${OIDC_CLIENT_SECRET:=placeholder}"
      issuerUrl: "${OIDC_ISSUER_URL:=https://pocket-id.${DOMAIN}}"
      scope: openid email profile
    passwordLogin:
      # Break-glass is flipping this in git: `immich-admin enable-password-login`
      # writes to the database, which the config file overrides.
      enabled: false
    server:
      externalDomain: https://immich.${DOMAIN}
