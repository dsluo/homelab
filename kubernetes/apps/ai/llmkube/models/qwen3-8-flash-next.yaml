  # files[0] handed to llama.cpp (it discovers the siblings itself). The prefix
  # ends at resolve/main so prefix + "/" + entry is a valid HF download URL.
  source: https://huggingface.co/AtomicChat/Qwen3.8-Flash-Next-GGUF/resolve/main
  sourceSecretRef:
    name: llmkube-hf-secret
  # Shard 00002 holds only the 38.4 GB n-gram table (per_layer_token_embd).
  # It is read ~3 MB/s at random and must stay mmap'd, never resident.
  files:
    - Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64-00001-of-00033.gguf
