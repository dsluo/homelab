---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate
spec:
  schedule: "0 * * * *"
  image: ghcr.io/renovatebot/renovate:44.61.3@sha256:5bddbecca7f03bb7974bd9cdc5979bc51e8cc8987bd54f9436c68226de537b64
  parallelism: 2
  provider:
    name: github
  discoveryFilters:
    - "dsluo/*"
  skipForks: true
  # The operator mints and refreshes the installation token itself, so there is
  # no RENOVATE_TOKEN to keep in sync.
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  webhook:
    enabled: true
    # GitHub signs each delivery with this token as the X-Hub-Signature-256
    # HMAC secret; sync applies it when it creates each repo's hook.
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook
        key: token
    # Puts the operator's hook on every discovered repo, so Dependency Dashboard
    # and rebase checkboxes fire a run instead of waiting for the hourly tick.
    # Uses the App installation token, which needs Repository webhooks: RW.
    sync:
      enabled: true
  renovateConfig:
    inline: |
      module.exports = {
        onboarding: false,
        // Discovery returns every repo the App is installed on; 'required'
        // keeps Renovate off the ones that were never onboarded.
        requireConfig: 'required',
        // Commits go through the GitHub API so they are attributed to the App;
        // without it a GitHub App install needs a gitAuthor matching the bot user.
        platformCommit: 'enabled',
      };
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
