---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-github-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      mergePolicy: Replace
      metadata:
        labels:
          # Opts this Secret in to being read at caller-chosen keys, which the
          # operator's policy engine requires. Without it the job is refused
          # with SecretRefNotOptedIn.
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        APP_ID: '{{ index . "APP_ID" }}'
        INSTALL_ID: '{{ index . "INSTALL_ID" }}'
        PEM: '{{ index . "PEM" }}'
  dataFrom:
    - extract:
        key: k8s-renovate-renovate-github-app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-webhook
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      mergePolicy: Replace
      metadata:
        labels:
          # Same opt-in as above; the operator reads this at a caller-chosen key.
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        token: '{{ index . "token" }}'
  dataFrom:
    - extract:
        key: k8s-renovate-renovate-webhook
