---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmks
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 1h
  values:
    victoria-metrics-operator:
      enabled: false # deployed separately
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "180d"
        storageDataPath: /victoria-metrics-data
        useStrictSecurity: true
        # Keep the workload identity tied to the kopiur mover identity. The
        # operator does not merge its strict-security defaults when a custom
        # uid is set, so spell out the complete hardened context here.
        securityContext:
          runAsNonRoot: true
          runAsUser: ${KOPIUR_UID}
          runAsGroup: ${KOPIUR_GID}
          fsGroup: ${KOPIUR_GID}
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        storage: null # override chart default; use existing PVC via volumes instead
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: "${APP}"
        volumeMounts:
          - name: data
            mountPath: /victoria-metrics-data
    vmcluster:
      enabled: false
    alertmanager:
      enabled: true
      spec:
        # mounted at /etc/vm/secrets/<name>/
        secrets:
          - alertmanager-notifiers
      config:
        route:
          receiver: blackhole
          group_by: [alertname, namespace, severity]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: blackhole
              matchers: ['alertname=~"Watchdog|InfoInhibitor"']
            # history of every alert; continue so criticals/warnings also page
            - receiver: discord
              continue: true
            - receiver: pushover
              matchers: ['severity=~"critical|warning"']
        # No InfoInhibitor rule: it would hide info alerts from Discord unless
        # a warning/critical is firing in the same namespace.
        inhibit_rules:
          - source_matchers: ['severity="critical"']
            target_matchers: ['severity=~"warning|info"']
            equal: [alertname, namespace]
          - source_matchers: ['severity="warning"']
            target_matchers: ['severity="info"']
            equal: [alertname, namespace]
        receivers:
          - name: blackhole
          - name: discord
            discord_configs:
              - webhook_url_file: /etc/vm/secrets/alertmanager-notifiers/discord_webhook_url
          - name: pushover
            pushover_configs:
              - user_key_file: /etc/vm/secrets/alertmanager-notifiers/pushover_user_key
                token_file: /etc/vm/secrets/alertmanager-notifiers/pushover_token
                # warnings arrive silently; criticals make noise
                priority: '{{ if eq .CommonLabels.severity "critical" }}0{{ else }}-1{{ end }}'
    vmalert:
      enabled: true
    vmauth:
      enabled: true
      spec:
        selectAllByDefault: true
        unauthorizedUserAccessSpec:
          disabled: true
        httpRoute:
          hostnames:
            - "metrics-ingest.${DOMAIN}"
          parentRefs:
            - name: envoy-internal
              namespace: network
    vmagent:
      enabled: true

    grafana:
      # deployed separately
      enabled: false
      # create GrafanaDataSources even though we're not using the grafana provided by VMKS
      forceDeployDatasource: true

    defaultRules:
      rules:
        # Two nodes can never absorb losing one, so these fire permanently.
        KubeCPUOvercommit:
          enabled: false
        KubeMemoryOvercommit:
          enabled: false

    defaultDashboards:
      grafanaOperator:
        enabled: true

    defaultDatasources:
      grafanaOperator:
        enabled: true

    prometheus-node-exporter:
      enabled: true
    kube-state-metrics:
      enabled: true
    kubelet:
      enabled: true
      vmScrape:
        spec:
          # Mirrors the chart 0.87.0 defaults minus the node-label labelmap —
          # re-diff against the chart on upgrade.
          #
          # The default `labelmap __meta_kubernetes_node_label_(.+)` copies every
          # node label onto every kubelet / cAdvisor series. Node Feature
          # Discovery (pulled in by the GPU operator) puts 76-140 labels on each
          # node, which blows past VictoriaMetrics' -maxLabelsPerTimeseries=30 and
          # makes vmsingle discard the series outright at ingestion. Nothing here
          # consumes the mapped labels and `instance` already carries the node
          # name, so don't map them at all — an allowlist a future operator can't
          # regress.
          relabelConfigs:
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet
    kubeApiServer:
      enabled: true
      vmScrape:
        spec:
          # endpoints replaces the chart's list wholesale; re-diff against the chart on upgrade
          endpoints:
            - port: https
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              # /metrics is ~20MB, over vmagent's 16MiB default -promscrape.maxScrapeSize
              max_scrape_size: 64MiB
              # bucket trims from kube-prometheus(-stack); remaining le values still cover the alert thresholds
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__, le]
                  regex: '(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?'
                - action: drop
                  sourceLabels: [__name__, le]
                  regex: 'apiserver_request_body_size_bytes_bucket;(150000|350000|550000|650000|850000|950000|(1\.15|1\.35|1\.55|1\.65|1\.85|1\.95|2\.15|2\.35|2\.55|2\.65|2\.85|2\.95)e\+06)'
                # per-resource-type watch/storage internals (~38k series); nothing here reads them
                - action: drop
                  sourceLabels: [__name__]
                  regex: 'apiserver_(watch_events_dispatch_duration_seconds|watch_list_duration_seconds|storage_list_duration_seconds|watch_cache_read_wait_seconds|watch_cache_initialization_duration_seconds)_.*'
    kubeControllerManager:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
    kubeDns:
      enabled: false # because coredns instead
    coreDns:
      enabled: true
    kubeEtcd:
      enabled: true
      service:
        port: 2381
        targetPort: 2381
        selector:
          # talos doesn't run etcd as a pod
          component: kube-apiserver
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http
    kubeScheduler:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
    kubeProxy:
      enabled: false # cilium replaces it
