---
# Bond members pinned by MAC; PCI-derived names shift when the board changes.
apiVersion: v1alpha1
kind: LinkAliasConfig
name: sfp0
selector:
  match: mac(link.permanent_addr) == "3c:fd:fe:24:45:60"
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: sfp1
selector:
  match: mac(link.permanent_addr) == "3c:fd:fe:24:45:62"
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - sfp0
  - sfp1
bondMode: active-backup
mtu: 1500
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.42
vlanID: 42
parent: bond0
addresses:
  - address: 10.0.42.3/24
routes:
  - gateway: 10.0.42.1
