---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  chartRef:
    kind: OCIRepository
    name: reloader
  interval: 1h
  values:
    fullnameOverride: reloader
    reloader:
      readOnlyRootFileSystem: true
      # For optional Secret refs that land after the pod started (frigate's
      # llm key). Creates seen during reloader's own startup sync are ignored.
      reloadOnCreate: true
      podMonitor:
        enabled: true
        namespace: "{{ .Release.Namespace }}"
