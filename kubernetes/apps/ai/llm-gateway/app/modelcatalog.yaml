# Merged over agentgateway's built-in catalog; feeds the /v1/models metadata.
# Keys are providerOverride and upstream model name (./models,
# ../../cliproxyapi/app/models.yaml). chatgpt mirrors the built-in openai
# entries; the rest follow each runtime's own /v1/models (llama.cpp's n_ctx is
# per slot). Only neuralwatt bills per token, so only it has rates.
