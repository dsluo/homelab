---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-kguardian
spec:
  hostnames:
    - "kguardian-mcp.${DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        # `mcp-<cr name>-proxy`, the operator's naming for both MCPServer and
        # MCPRemoteProxy.
        - name: mcp-kguardian-proxy
          port: 8080
