  format: gguf
  quantization: AD-4.27bpw-Q4_K_M
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 2 # 3090 Ti + 3070 on talos1
      vendor: nvidia
      layers: 999 # ngl=999; expert tensors come back off the GPU via moeCPULayers
      # Emits --tensor-split 9,1; only the ratio matters. It splits layers, and
      # the 3070 only sheds a whole layer at certain steps (9:1 through 11:1 all
      # leave it the same layers). moeCPULayers unloads the 3090 Ti only.
      sharding:
        strategy: layer
        layerSplit:
          - "0-8" # 3090 Ti
          - "9-9" # 3070
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-flash-next
spec:
  modelRef: qwen3-8-flash-next
  runtime: llamacpp
  # qwen4exp needs b10666 or newer; older builds cannot load the architecture.
  image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11434@sha256:c6fd6053d3b6a1a54849ab5468971cf3ae03fbf3d72fdfb25a1f862e320cace3
  runtimeClassName: nvidia
  # Off while talos1 drops to one GPU; see qwen3-8-27b-mtp.yaml. Drop this when
  # the ModelPool is restored.
  replicas: 0
  priorityClassName: gpu-preemptible

  # Trades VRAM against talos1 RAM at ~1.03 GB of experts per layer. Every
  # CPU-side expert is read per token and must stay in page cache: 36 churned
  # (GBs of refaults, throughput falling run over run), 34 holds. Lowering it
  # buys little (30 vs 32: ~3% prefill, generation flat).
  moeCPULayers: 34
  # This GGUF names the n-gram table per_layer_token_embd, not ple_ngram_embd.
  # Atomic's README says it lands on host unaided; kept explicit until
  # confirmed.
  tensorOverrides:
    - per_layer_token_embd=CPU

  # --- typed preset fields ---
  # Qwen Sparse Attention's top_k allocates from the CUDA pool at runtime, not
  # at load: ~400-450 MB per card by 90k tokens. A config that loads can still
  # OOM mid-prompt, so validate any context/ubatch/split change with a
  # near-max-context request. Measured at 189k: 1.15 / 0.73 GB still free.
  #
  # A crashlooping load strands the ModelPool in Swapping and takes the 27B down
  # with it. Keep ../../litellm/proxy/models/llmkube.yaml maxInputTokens in step.
  contextSize: 196608
  parallelSlots: 1 # CPU-side experts do not parallelise; one slot gets the window
  batchSize: 1024
  uBatchSize: 768 # prefill ~+60% over 256; the compute buffer grows on both cards
  jinja: true # required for the chat-template-kwargs below

  # KV left at f16: q8_0 saves ~0.75 GB but loses QSA's sparse decode kernel
  # past ~32k and is untested for quality on qwen4exp.

  extraArgs:
    - --alias
    - Qwen/Qwen3.8-Flash-Next
    # Auto-fit mis-sizes this architecture and fails to allocate.
    - -fit
    - "off"
    # Drafts from n-grams already in context: no draft model, no VRAM.
    - --spec-type
    - ngram-mod
    # Qwen's thinking-mode preset for this model, unmodified.
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0.0"
    - --presence-penalty
    - "0.0"
    - --repeat-penalty
    - "1.0"
    # xhigh spends minutes thinking per reply; the ModelRouter's
    # responseHeaderTimeout is sized for it. Drop to "medium" for latency.
    - --chat-template-kwargs
    - '{"reasoning_effort":"xhigh"}'

  # Measured 2026-09-29, code rewrite (1.7k prompt, ~2.3k out), warm: prefill
  # 273-304 tok/s, generation 45-46 tok/s, ngram drafts ~85% accepted. 189k
  # needle: 120 tok/s prefill (26 min), 16.5 tok/s generation, PASS. The first
  # request after a load pays the fault-in at roughly a third of that.
  resources:
    # Experts run on CPU here, so this is real compute.
    cpu: "8"
    # Soft-reserves page cache for the CPU-side experts so the scheduler does
    # not pack talos1 with pods that would evict them.
    memory: 36Gi
    # mmap'd weights are charged to this cgroup, so a limit at the request
    # evicts the model's own experts and halves throughput. Page cache over
    # the request is reclaimable, not an OOM risk.
    memoryLimit: 56Gi
    gpu: 2

  endpoint:
    port: 8080
    type: ClusterIP
