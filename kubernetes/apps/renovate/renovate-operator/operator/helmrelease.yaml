---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    # Without this every object is named renovate-operator-renovate-operator.
    fullnameOverride: renovate-operator
    crd:
      install: true
      # Ship the CRDs as ordinary release resources rather than through the
      # chart's kubectl-image Helm hook Job, so upgrades ride the normal path.
      mode: template
    config:
      logStorage:
        # DB 2 on the valkey below, so run logs outlive an operator restart.
        mode: valkey
      jobTTLSecondsAfterFinished: 86400
    valkey:
      # Backs three things on one instance, split across DBs 0-2: the session
      # store, Renovate's package cache (RENOVATE_REDIS_URL, forwarded to every
      # executor job), and the log store above. The package cache is shared
      # across repos, which is where the win is — all 20 resolve the same
      # registries each cycle.
      enabled: true
      auth:
        enabled: true
        usersExistingSecret: renovate-valkey
        aclUsers:
          default:
            # Without this the valkey pod reads key `default` while the
            # operator reads `default-password` from the same Secret.
            passwordKey: default-password
      dataStorage:
        # A cache and sessions only; a PVC would pin valkey to one node of two
        # for data that is cheaper to rebuild than to move.
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
    route:
      enabled: true
      hostnames: ["renovate.${DOMAIN}"]
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
    webhook:
      enabled: true
      route:
        enabled: true
        # Unlike the UI, this has to be reachable by GitHub, so it goes out
        # through the Cloudflare gateway rather than envoy-internal. The chart
        # derives WEBHOOK_BASE_URL from this hostname and appends it to
        # policy.allowedHosts, which sync needs to write the hook URL.
        hostnames: ["renovate-webhook.${DOMAIN}"]
        parentRefs:
          - name: envoy-cloudflare
            namespace: network
            sectionName: https
    auth:
      oidc:
        enabled: true
        issuerUrl: "https://pocket-id.${DOMAIN}"
        clientId: renovate
        existingSecret: renovate-oidc-credentials
        secretKey: OIDC_CLIENT_SECRET
        # TLS terminates at the Gateway; the chart only infers https from
        # ingress.tls, which this deployment does not use.
        redirectUrl: "https://renovate.${DOMAIN}/auth/callback"
    authorization:
      # pocket-id decides who may log in, and everyone who does is an admin.
      # Leaving this on would hide every job until access rules are configured.
      enabled: false
    rbac:
      ownNamespaceOnly: true
    policy:
      # Bounds what a RenovateJob may make the operator do with its own
      # credentials. The chart defaults already cover this job; its
      # githubAppReference additionally needs the allow-ref label on the Secret,
      # which job/externalsecret.yaml sets.
      enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        grafanaDashboard:
          # The Grafana instance lives in observability; without this the CR
          # reconciles to nothing.
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              dashboards: grafana
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
