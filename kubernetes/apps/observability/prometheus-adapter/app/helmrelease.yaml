---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prometheus-adapter
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    fullnameOverride: *app
    prometheus:
      url: http://vmsingle-vmks-victoria-metrics-k8s-stack.observability.svc.cluster.local
      port: 8428
    rules:
      # Only external metrics: metrics-server already owns
      # v1beta1.metrics.k8s.io, and the default custom rules aren't used.
      default: false
      external:
        - seriesQuery: '{__name__="probe_success"}'
          resources:
            namespaced: false
          name:
            as: probe_success
          # One successful probe in the last minute counts as up, so a single
          # dropped connect doesn't scale apps down.
          metricsQuery: max_over_time(<<.Series>>{<<.LabelMatchers>>}[1m])
