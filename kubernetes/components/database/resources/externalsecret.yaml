---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${DB_APP}-postgres-secret
spec:
  # CreatedOnce, not Periodic: the generator mints a fresh password on every
  # refresh, which would silently rotate the role out from under the app.
  refreshPolicy: CreatedOnce
  target:
    name: ${DB_APP}-postgres-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: ${DB_NAMESPACE}
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      mergePolicy: Replace
      data:
        # DatabaseRole rejects a passwordSecret missing either field; the
        # generator only supplies password.
        username: ${DB_APP}
        password: '{{ index . "password" }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: postgres-password
