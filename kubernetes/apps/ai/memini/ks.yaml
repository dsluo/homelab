---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app memini
spec:
  interval: 1h
  path: ./kubernetes/apps/ai/memini/app
  components:
    - ../../../../components/database
    - ../../../../components/litellm-key
  dependsOn:
    - name: external-secrets-config
      namespace: external-secrets
    - name: llmkube-models
    - name: litellm
  postBuild:
    substitute:
      APP: *app
      # memini's own migration runs CREATE EXTENSION vchord as the unprivileged
      # owner role, so it only succeeds once CNPG has created it here. Nothing
      # orders the two — first boot crash-loops until CNPG wins.
      DB_EXTENSIONS: '[{"name":"vector"},{"name":"vchord"}]'
      LITELLM_KEY_MODELS: '"llmkube/Qwen/Qwen3-Embedding-0.6B", "llmkube/Qwen/Qwen3-Reranker-0.6B"'
    substituteFrom:
      - name: cluster-global-config
        kind: ConfigMap
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
