---
# No PushSecret: atuin-ai runs in-cluster, so the key is delivered by reflector
# mirroring this Secret into tools rather than through 1Password.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: atuin-ai
spec:
  proxyRef: litellm
  keyAlias: atuin-ai
  secretName: atuin-ai-litellm-key
  secretKey: OPENAI_API_KEY
  secretAnnotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: tools
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
