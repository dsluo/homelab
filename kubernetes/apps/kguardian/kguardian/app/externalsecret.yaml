---
# Generated in-cluster rather than stored in 1Password: llm-bridge is the only
# thing that validates it, so there is nothing to share with. Read it out with
# `just kguardian-mcp-token` when a client needs it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kguardian-mcp-token
spec:
  length: 48
  # No symbols: the value is spliced into an Authorization header below, where
  # a stray control or non-token character would make the header unparseable.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kguardian-mcp-token
spec:
  # CreatedOnce, not Periodic: the generator mints a fresh value on every
  # refresh, which would rotate the token out from under the proxy mid-session
  # and leave the two sides disagreeing until both pods restarted.
  refreshPolicy: CreatedOnce
  target:
    name: kguardian-mcp-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Replace
      data:
        # What llm-bridge compares the incoming bearer token against, and what
        # the client sends as `Authorization: Bearer <token>`.
        token: '{{ index . "password" }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kguardian-mcp-token
