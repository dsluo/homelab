---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${HTTPROUTE_NAME:=${APP}}
  oidc:
    provider:
      issuer: "https://pocket-id.${DOMAIN}"
      # Setting both endpoints skips EG's discovery fetch on every translation;
      # one failed fetch 500s every OIDC route and crashes envoy-internal.
      authorizationEndpoint: "https://pocket-id.${DOMAIN}/authorize"
      tokenEndpoint: "https://pocket-id.${DOMAIN}/api/oidc/token"
      endSessionEndpoint: "https://pocket-id.${DOMAIN}/api/oidc/end-session"
    clientID: "${OIDC_APP:=${APP}}"
    clientSecret:
      name: "${OIDC_APP:=${APP}}-oidc-credentials"
    redirectURL: "https://${SUBDOMAIN:=${OIDC_APP:=${APP}}}.${DOMAIN}/oauth2/callback"
    logoutPath: "/logout"