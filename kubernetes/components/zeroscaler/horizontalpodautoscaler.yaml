---
# Scales ${APP} to zero while the NAS's NFS port is unreachable and back to
# one when it answers. If the metric is missing (adapter or probe down) the
# HPA holds the current replica count instead of scaling.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "${APP}"
spec:
  minReplicas: 0
  maxReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: "${APP}"
  metrics:
    - type: External
      external:
        metric:
          name: probe_success
          selector:
            matchLabels:
              job: nfs_probe
        target:
          type: Value
          value: "1"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
    scaleUp:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
