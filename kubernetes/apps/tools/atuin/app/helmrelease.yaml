---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app atuin
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          *app :
            image:
              repository: ghcr.io/atuinsh/atuin
              tag: 18.24.0@sha256:81878ae6f68ddc3844d9c1779b6fe59cf8de844d17a8750cff5928d70f044842
            args: [start]
            env:
              ATUIN_DB_URI:
                valueFrom:
                  secretKeyRef:
                    name: atuin-postgres-secret
                    key: uri
              ATUIN_READ_DB_URI:
                valueFrom:
                  secretKeyRef:
                    name: atuin-postgres-secret
                    key: uri_r
              ATUIN_HOST: 0.0.0.0
              ATUIN_PORT: &port 8888
              ATUIN_OPEN_REGISTRATION: "true"

              ATUIN_METRICS__ENABLE: "true"
              ATUIN_METRICS__HOST: 0.0.0.0
              ATUIN_METRICS__PORT: &metrics 9001
    service:
      *app :
        ports:
          http:
            port: *port
          metrics:
            port: *metrics
    route:
      *app :
        hostnames:
          - "atuin.${DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: *app
                port: *port
