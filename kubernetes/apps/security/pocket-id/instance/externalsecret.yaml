apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocketid-postgres-secret
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pocketid-postgres-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "database"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      mergePolicy: Replace
      data:
        username: '{{ index . "username" }}'
        password: '{{ index . "password" }}'
  dataFrom:
    - extract:
        key: k8s-security-pocketid-postgres-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-secret
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pocket-id-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      mergePolicy: Replace
      data:
        ENCRYPTION_KEY: '{{ index . "ENCRYPTION_KEY" }}'
        databaseUrl: '{{ index . "databaseUrl" }}'
        mailboxPassword: '{{ index . "mailboxPassword" }}'
  dataFrom:
    - extract:
        key: k8s-security-pocket-id-secret
