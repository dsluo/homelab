---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-kguardian
spec:
  hostnames:
    - "kguardian-mcp.${DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        # `mcp-<cr name>-remote-proxy`. An MCPServer gets `mcp-<cr name>-proxy`
        # instead — the two kinds do not share the suffix. The CR's status.url
        # names it, which is the only authority worth trusting here.
        - name: mcp-kguardian-remote-proxy
          port: 8080
