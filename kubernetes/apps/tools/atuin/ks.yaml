---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app atuin
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/tools/atuin/app
  components:
    - ../../../../components/database
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - name: cluster-global-config
        kind: ConfigMap
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tools
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app atuin-ai
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: external-secrets
    # For the LiteLLMVirtualKey whose Secret reflector mirrors in here — the
    # pod cannot start without CHAT_API_KEY. Ordering only: reflector copies
    # asynchronously, so a first deploy still waits on the mirror.
    - name: litellm
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/tools/atuin/ai
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - name: cluster-global-config
        kind: ConfigMap
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tools
  wait: false
