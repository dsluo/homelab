---
# The raw key, for the consumer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${LLM_KEY_APP}-llm-key
spec:
  # CreatedOnce: the generator mints a fresh key on every refresh, which would
  # rotate it out from under the consumer.
  refreshPolicy: CreatedOnce
  target:
    name: ${LLM_KEY_APP}-llm-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: ${LLM_KEY_NAMESPACES}
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      mergePolicy: Replace
      data:
        ${LLM_KEY_SECRET_KEY}: '{{ index . "password" }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: llm-key
---
# The gateway's view of the same key. A separate Secret because the gateway
# registers every data entry of a selected Secret as a key, so the raw entry
# above would register a second copy without metadata.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${LLM_KEY_APP}-llm-apikey
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: SecretStore
    name: llm-keys
  target:
    name: ${LLM_KEY_APP}-llm-apikey
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          llm-gateway/apikey: "true"
      mergePolicy: Replace
      data:
        # metadata is what ../../../apps/ai/llm-gateway/app/policy.yaml reads
        # as apiKey.user_id and apiKey.models.
        ${LLM_KEY_APP}: '{"key":"{{ .key }}","metadata":{"user_id":"${LLM_KEY_APP}","models":${LLM_KEY_MODELS}}}'
  data:
    - secretKey: key
      remoteRef:
        key: ${LLM_KEY_APP}-llm-key
        property: ${LLM_KEY_SECRET_KEY}
