---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: esphome-builder
spec:
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
  repository:
    kind: ClusterRepository
    name: homelab
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    # One kopia source per StatefulSet claim (/pvc/state-esphome-builder-N), so
    # each receiver restores its own pairing identity.
    - pvcSelector:
        labelSelector:
          matchLabels:
            backup: esphome-builder
      sourcePathStrategy: PvcName
  volumeSnapshotClassName: openebs-zfs-snapshot
