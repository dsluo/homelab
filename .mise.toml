[env]
'_'.file = { path = ".env" }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_CMD = "op read 'op://homelab/kube age key/password'"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tools]
# utilities
"aqua:casey/just" = "1.58.0"
"aqua:jqlang/jq" = "1.8.1"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:google/go-containerregistry" = "0.22.1"
# talos
"aqua:postfinance/topf" = "0.6.0"
"aqua:siderolabs/talos" = "1.14.0"
# k8s
"aqua:derailed/k9s" = "0.51.0"
"aqua:nklmilojevic/sofka" = "0.25.5"
"aqua:helm/helm" = "4.3.0"
"aqua:helmfile/helmfile" = "1.7.4"
"aqua:kubernetes-sigs/kustomize" = "5.8.0"
"aqua:kubernetes/kubectl" = "1.34.3"
"aqua:kubecolor/kubecolor" = "0.7.1"
# app clis
"aqua:cilium/cilium-cli" = "0.20.0"
"aqua:cloudflare/cloudflared" = "2026.9.1"
"github:cloudnative-pg/cloudnative-pg" = "1.30.0"
"github:home-operations/kopiur" = "0.10.8"
# One repo publishes every kguardian component, each under its own tag prefix,
# and the CLI's asset is still named after the `advisor` binary it grew out of.
"github:kguardian-dev/kguardian" = { version = "advisor/v1.10.0", rename_exe = "kubectl-kguardian" }
"aqua:kopia/kopia" = "0.23.1"
"aqua:cilium/hubble" = "1.19.4"
# flux
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:getsops/sops" = "3.13.3"
"github:home-operations/flate" = "0.6.5"
# authoring tools
"pipx:copier" = { version = "9.18.2", uvx_args = "--with copier-template-extensions" }
# iac
"aqua:gruntwork-io/terragrunt" = "1.1.4"
"aqua:opentofu" = "1.12.6"
"aqua:opentofu/tofu-ls" = "0.5.3"
# ai/mcp
"github:grafana/mcp-grafana" = "1.4.0"
"pipx:unifi-network-mcp" = "0.32.6"
