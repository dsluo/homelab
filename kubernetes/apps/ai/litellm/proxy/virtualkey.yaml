---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: atuin-ai
spec:
  proxyRef: litellm
  keyAlias: atuin-ai
  secretName: atuin-ai-litellm-key
  secretKey: OPENAI_API_KEY
  secretAnnotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: tools
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: opencode
spec:
  proxyRef: litellm
  keyAlias: opencode
  secretName: opencode-litellm-key
  secretKey: OPENAI_API_KEY
  models:
    - "llmkube/*"
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: pi
spec:
  proxyRef: litellm
  keyAlias: pi
  secretName: pi-litellm-key
  secretKey: OPENAI_API_KEY
  models:
    - "llmkube/*"
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: home-assistant
spec:
  proxyRef: litellm
  keyAlias: home-assistant
  secretName: home-assistant-litellm-key
  secretKey: OPENAI_API_KEY
  # The client-facing modelName from ./models/llmkube.yaml, not params.model —
  # a name that matches nothing does not fail open, it leaves the key able to
  # call nothing.
  models:
    - llmkube/google/gemma-4-12B-it-qat
