---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app llmkube
spec:
  interval: 1h
  path: ./kubernetes/apps/ai/llmkube/app
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  # wait: true so dependents block until the HelmRelease is actually Ready, not
  # just applied. litellm-operator runs with llmkube.autoRegister, and that is a
  # one-shot capability check at operator startup — see ../litellm/ks.yaml.
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app llmkube-models
spec:
  interval: 1h
  path: ./kubernetes/apps/ai/llmkube/models
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  dependsOn:
    - name: llmkube
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
