---
# Split out so cnpg-cluster can substituteFrom the Secret this creates —
# Flux substitutes before it applies, so one Kustomization cannot do both.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage-endpoint
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ClusterExternalSecret
      name: garage-endpoint
    - apiVersion: v1
      kind: Secret
      name: garage-endpoint
      namespace: database
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ClusterExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/database/cloudnative-pg/garage-endpoint
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: external-secrets
    - name: openebs
      namespace: openebs-system
  interval: 1h
  path: ./kubernetes/apps/database/cloudnative-pg/operator
  postBuild:
    substituteFrom:
      - name: cluster-global-config
        kind: ConfigMap
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-cluster
spec:
  dependsOn:
    - name: cnpg-operator
    - name: plugin-barman-cloud
    - name: garage-endpoint
  interval: 1h
  path: ./kubernetes/apps/database/cloudnative-pg/cluster
  postBuild:
    substituteFrom:
      - name: cluster-global-config
        kind: ConfigMap
      - name: garage-endpoint
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plugin-barman-cloud
spec:
  dependsOn:
    - name: external-secrets-config
      namespace: external-secrets
    - name: cnpg-operator
  interval: 1h
  path: ./kubernetes/apps/database/cloudnative-pg/plugin-barman-cloud
  postBuild:
    substituteFrom:
      - name: cluster-global-config
        kind: ConfigMap
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
