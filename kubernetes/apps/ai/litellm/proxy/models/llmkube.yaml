---
# Hand-written replacements for what ../../operator's llmkube auto-registration
# used to generate (now off — see ../../operator/helmrelease.yaml). Written out
# because the operator hardcodes ModelName to the InferenceService name
# (internal/controller/llmkube_projection.go) with no knob, and we want the
# client-facing IDs namespaced by backend: provider name + llama.cpp --alias.
# One divergence — the 27b is published as …-27B-MTP, where its --alias is
# plain Qwen/Qwen3.8-27B.
#
# The cost of hand-writing: model_info no longer comes from the GGUF (context
# length) or the runtime flags (mode), and a new InferenceService needs an entry
# here. The info blocks below are copies of what the projection produced.
#
# spec.params.model is NOT the client-facing name — it is litellm's provider
# routing prefix plus the string forwarded upstream, and never leaves the proxy.
# The prefix must resolve against litellm.provider_list; "llmkube/" is not a
# provider and would raise "LLM Provider NOT provided". The forwarded string is
# load-bearing for the 27b: it reaches the router-proxy, whose BackendNameMatch
# strategy picks the backend by it, so it must equal the ModelRouter backend
# name. The entries that still hit llama.cpp directly ignore it (it serves
# whatever it loaded), so they keep the modelRef the projection used.
#
# metadata.name is deliberately NOT the InferenceService name: the generated
# models carry a controller ownerReference to their InferenceService, so reusing
# those names would hand Flux a resource that llmkube's GC can delete.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: llmkube-qwen3-8-27b-mtp
spec:
  modelName: llmkube/Qwen/Qwen3.8-27B-MTP
  params:
    model: openai/qwen3-8-27b-mtp
    # The router-proxy, not the Service: qwen is a ModelPool member, and the proxy
    # is what makes a non-resident member resident before dispatching to it.
    # See ../../../llmkube/models/modelrouter.yaml.
    apiBase: http://inference-router-proxy.ai.svc.cluster.local:8080/v1
    # llama.cpp runs without --api-key, but litellm's openai provider errors on
    # an unset key and falls back to OPENAI_API_KEY. Any non-empty string does.
    # (Repeated per document — YAML anchors do not cross a --- boundary.)
    apiKey: sk-llmkube-noauth
  info:
    # ../../../llmkube/models/qwen3-8-27b-mtp.yaml contextSize, which is also what
    # the GGUF reports and what the projection read out of Model.status.
    maxInputTokens: 262144
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: llmkube-qwen3-8-flash-next
spec:
  modelName: llmkube/Qwen/Qwen3.8-Flash-Next
  params:
    # Must equal the ModelRouter backend name — BackendNameMatch routes on it.
    model: openai/qwen3-8-flash-next
    # The router-proxy, not the Service: flash-next and the 27b are both
    # ModelPool members and cannot be resident at once, so the proxy is what
    # swaps this one in before dispatching.
    apiBase: http://inference-router-proxy.ai.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
  info:
    # ../../../llmkube/models/qwen3-8-flash-next.yaml contextSize. Still under
    # the model's native 262144 — raise both together.
    maxInputTokens: 131072
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: llmkube-qwen3-embedding-0-6b
spec:
  modelName: llmkube/Qwen/Qwen3-Embedding-0.6B
  params:
    model: openai/qwen3-embedding-0-6b
    apiBase: http://qwen3-embedding-0-6b.ai.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
  info:
    mode: embedding
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: llmkube-qwen3-reranker-0-6b
spec:
  modelName: llmkube/Qwen/Qwen3-Reranker-0.6B
  params:
    # hosted_vllm, not openai — the one place the projection's hardcoded prefix
    # was actively wrong. litellm's rerank dispatch (litellm/rerank_api/main.py)
    # branches per provider and has no openai arm, so the generated model raised
    # on /v1/rerank. HostedVLLMRerankConfig.get_complete_url appends /rerank to
    # the api_base below, which is exactly what llama.cpp --reranking serves.
    model: hosted_vllm/qwen3-reranker-0-6b
    apiBase: http://qwen3-reranker-0-6b.ai.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
  info:
    mode: rerank
