---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app litellm-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    replicaCount: 1
    controller:
      leaderElection:
        # On (the chart default), deliberately unlike llmkube next door — do not
        # harmonize the two. The chart sets no strategy, so even at one replica
        # the default maxSurge overlaps two operators on every upgrade, and this
        # one writes to litellm's admin API via non-idempotent POST /model/new.
        # Duplicate rows that result are unreapable: syncModels keys on
        # ModelName and only ever tracks one of the pair.
        enabled: true
    llmkube:
      # Off. Auto-registration mirrors every Ready InferenceService into a
      # LiteLLMModel, but hardcodes ModelName to the InferenceService name
      # (internal/controller/llmkube_projection.go) with no chart value or flag
      # to change it, and hardcodes an openai/ provider prefix that litellm's
      # rerank dispatch cannot route. ../proxy/models/llmkube.yaml replaces the three
      # generated models by hand to get llmkube/-namespaced client-facing IDs
      # and a working reranker.
      #
      # Turning this back on republishes the bare InferenceService names
      # alongside the hand-written ones — six models, not three. Delete
      # ../proxy/models/llmkube.yaml in the same change if you ever do.
      autoRegister: false
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
