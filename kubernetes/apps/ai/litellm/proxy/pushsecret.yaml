---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencode-litellm-key
spec:
  deletionPolicy: Retain
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: opencode-litellm-key
  data:
    - match:
        remoteRef:
          remoteKey: k8s-ai-opencode-litellm-key
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          fieldType: concealed
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: pi-litellm-key
spec:
  deletionPolicy: Retain
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: pi-litellm-key
  data:
    - match:
        remoteRef:
          remoteKey: k8s-ai-pi-litellm-key
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          fieldType: concealed
