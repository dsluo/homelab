[env]
'_'.file = { path = ".env" }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_CMD = "op read 'op://homelab/kube age key/password'"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tools]
# utilities
"aqua:casey/just" = "1.59.0"
"aqua:jqlang/jq" = "1.8.1"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:google/go-containerregistry" = "0.22.1"
# talos
"aqua:postfinance/topf" = "0.6.2"
"aqua:siderolabs/talos" = "1.14.5"
# k8s
"aqua:derailed/k9s" = "0.51.0"
"aqua:nklmilojevic/sofka" = "0.33.0"
"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:kubernetes-sigs/kustomize" = "5.8.0"
"aqua:kubernetes/kubectl" = "1.34.3"
"aqua:kubecolor/kubecolor" = "0.8.0"
# app clis
"aqua:cilium/cilium-cli" = "0.20.2"
"aqua:cloudflare/cloudflared" = "2026.10.6"
"github:cloudnative-pg/cloudnative-pg" = "1.30.1"
"github:home-operations/kopiur" = "0.10.16"
# One repo publishes every kguardian component, each under its own tag prefix,
# and the CLI's asset is still named after the `advisor` binary it grew out of.
"github:kguardian-dev/kguardian" = { version = "advisor/v1.12.0", rename_exe = "kubectl-kguardian" }
"aqua:kopia/kopia" = "0.23.1"
"go:github.com/eleboucher/memini/cmd/memini" = "0.7.37"
"aqua:cilium/hubble" = "1.20.2"
# flux
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.10.0"
"aqua:getsops/sops" = "3.13.3"
"github:home-operations/flate" = "0.6.5"
# authoring tools
"pipx:copier" = { version = "9.19.1", uvx_args = "--with copier-template-extensions" }
# iac
"aqua:gruntwork-io/terragrunt" = "1.2.1"
"aqua:opentofu" = "1.13.2"
"aqua:opentofu/tofu-ls" = "0.5.3"
# ai/mcp
"github:grafana/mcp-grafana" = "2.1.1"
"pipx:unifi-network-mcp" = "0.42.0"
"pipx:mcp-server-mikrotik" = "0.26.2.0"
