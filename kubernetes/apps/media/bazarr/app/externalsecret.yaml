apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-secret
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bazarr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: k8s-media-bazarr-secret/password
