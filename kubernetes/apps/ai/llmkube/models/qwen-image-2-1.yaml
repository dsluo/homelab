---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen-image-2-1
spec:
  source: https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main
  sourceSecretRef:
    name: llmkube-hf-secret
  files:
    - diffusion_models/qwen_image_2.1_int8_convrot.safetensors
    # bf16, not int8_convrot: sd.cpp misreads the int8 encoder's shapes and
    # aborts on a scale-tensor assert. Carries the vision tower for edits.
    - text_encoders/qwen3vl_8b_bf16.safetensors
    - vae/qwen_image_2.1_vae_bf16.safetensors
  format: safetensors
  quantization: int8_convrot
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 2
      vendor: nvidia
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen-image-2-1
spec:
  modelRef: qwen-image-2-1
  # llamacpp, not generic: only llamacpp/vllm/sglang stage weights into
  # /models. The shell drops the llama-server args llmkube appends, using only
  # --model (files[0]) to find the staged directory.
  runtime: llamacpp
  image: ghcr.io/leejet/stable-diffusion.cpp:master-cuda@sha256:4fbe41d95d1727c2dc77d9cdbff82f5492977c93c017b300e4bbdaffb4ef6418
  runtimeClassName: nvidia
  # Pool member: the ModelPool owns replicas. The router only proxies chat,
  # embeddings and rerank, so swap this in with a chat request naming it.
  priorityClassName: gpu-preemptible
  command:
    - /bin/sh
    - -c
    # cuda0 is the 3090 Ti (CUDA orders fastest first); the 3070 sits idle.
    - |
      while [ "$#" -gt 0 ] && [ "$1" != --model ]; do shift; done
      d=$(dirname "$(dirname "$2")")
      exec /sd-server --listen-ip 0.0.0.0 --listen-port 8080 \
        --diffusion-model "$d/diffusion_models/qwen_image_2.1_int8_convrot.safetensors" \
        --llm "$d/text_encoders/qwen3vl_8b_bf16.safetensors" \
        --vae "$d/vae/qwen_image_2.1_vae_bf16.safetensors" \
        --backend cuda0 --offload-to-cpu --diffusion-fa -v
    - sd-server
  probeOverrides:
    startup:
      httpGet:
        path: /v1/models
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    readiness:
      httpGet:
        path: /v1/models
        port: 8080
      periodSeconds: 10
    liveness:
      httpGet:
        path: /v1/models
        port: 8080
      periodSeconds: 15
  resources:
    cpu: "1"
    # --offload-to-cpu parks all ~24 GiB of weights in RAM between stages.
    memory: 32Gi
    # Both GPUs, like the LLM members: requesting one could land on the 3070.
    gpu: 2
  endpoint:
    port: 8080
    type: ClusterIP
