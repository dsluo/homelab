---
# The admin port also serves the full config dump, so only envoy-internal (and
# through it, the OIDC-gated UI route) may reach it. Everything in-cluster may
# still reach the LLM listener, as with litellm before.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llm-gateway
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: llm-gateway
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "80"
            - port: "15020"
            - port: "15021"
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "15000"
