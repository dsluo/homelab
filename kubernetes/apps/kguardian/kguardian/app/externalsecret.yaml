---
# Generated in-cluster rather than stored in 1Password: only llm-bridge and the
# ToolHive proxy ever see it. `just kguardian-mcp-token` reads it out for the
# port-forward path, which stays available alongside the gated route.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kguardian-mcp-token
spec:
  length: 48
  # No symbols: the value is spliced into an Authorization header below, where
  # a stray control or non-token character would make the header unparseable.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kguardian-mcp-token
spec:
  # CreatedOnce, not Periodic: the generator mints a fresh value on every
  # refresh, which would rotate the token out from under the proxy mid-session
  # and leave the two sides disagreeing until both pods restarted.
  refreshPolicy: CreatedOnce
  target:
    name: kguardian-mcp-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: ai
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      mergePolicy: Replace
      data:
        # What llm-bridge compares the incoming bearer token against.
        token: '{{ index . "password" }}'
        # The upstream hop from the ToolHive proxy in ai, which injects a header
        # value verbatim — so the `Bearer ` has to be baked in on this side.
        authorization: 'Bearer {{ index . "password" }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kguardian-mcp-token
