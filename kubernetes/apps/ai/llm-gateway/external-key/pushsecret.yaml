---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ${LLM_KEY_APP}-llm-key
spec:
  # Governs the copy in 1Password, not the k8s Secret. Delete/None only;
  # Retain is ExternalSecret vocabulary and fails admission.
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: ${LLM_KEY_APP}-llm-key
  data:
    - match:
        remoteRef:
          remoteKey: k8s-ai-${LLM_KEY_APP}-llm-key
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          fieldType: concealed
