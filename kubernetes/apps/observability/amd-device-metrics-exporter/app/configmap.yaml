---
# The upstream Grafana dashboards filter on cluster_name and key per-GPU
# panels on gpu_uuid; both are off unless set here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: amd-device-metrics-exporter-config
data:
  config.json: |
    {
      "GPUConfig": {
        "Labels": ["GPU_UUID", "DRIVER_VERSION", "VBIOS_VERSION", "CARD_VENDOR", "CARD_SERIES"],
        "CustomLabels": {
          "CLUSTER_NAME": "homelab"
        }
      }
    }
