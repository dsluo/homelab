---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hister-mcp-secret
# Stays unready until a Hister personal token exists in 1Password; Hister only
# mints tokens after the first Pocket ID login, so this cannot be bootstrapped.
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hister-mcp-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      mergePolicy: Replace
      data:
        AUTHORIZATION: 'Bearer {{ index . "HISTER_ACCESS_TOKEN" }}'
  dataFrom:
    - extract:
        key: k8s-ai-hister-mcp-secret
