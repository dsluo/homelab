---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./configsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./resourceclaimtemplate.yaml
  - ./usergroup.yaml
patches:
  # Immich also returns to /user-settings (account linking) and to the mobile
  # app's custom scheme; the component only sets the one login callback.
  - target:
      group: pocketid.internal
      version: v1alpha1
      kind: PocketIDOIDCClient
    patch: |
      - op: add
        path: /spec/callbackUrls/-
        value: https://immich.${DOMAIN}/user-settings
      - op: add
        path: /spec/callbackUrls/-
        value: app.immich:///oauth-callback
  # The staged clone requests the full 1400Gi; an Immediate-binding class skips
  # the scheduler's capacity check, which can't see that a ZFS clone is free.
  - target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
    patch: |
      - op: add
        path: /spec/staging
        value:
          storageClassName: openebs-zfspv-bulk-staging
