---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: github-actions
spec:
  proxyRef: litellm
  keyAlias: github-actions
  secretName: github-actions-litellm-key
  secretKey: OPENAI_API_KEY
  models:
    - llmkube/Qwen/Qwen3.8-27B-MTP
    - llmkube/Qwen/Qwen3.8-Flash-Next
    - neuralwatt/deepseek-v4.1-flash
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: github-actions-litellm-key
spec:
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: github-actions-litellm-key
  data:
    - match:
        remoteRef:
          remoteKey: k8s-ai-github-actions-litellm-key
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          fieldType: concealed
