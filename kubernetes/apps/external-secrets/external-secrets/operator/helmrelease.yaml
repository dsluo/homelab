---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    leaderElect: true
    rbac:
      # Chart default grants serviceaccounts/token create cluster-wide. The
      # narrow external-secrets-token-request Role in config/rbac.yaml replaces it.
      serviceAccountTokenCreate: false
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
    webhook:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
