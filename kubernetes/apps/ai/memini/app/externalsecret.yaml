apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini-secret
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: memini-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: k8s-ai-memini-secret/MEMINI_API_KEY
