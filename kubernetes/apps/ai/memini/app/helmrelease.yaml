---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    fullnameOverride: *app
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Pin to the chart's default runtime uid/gid so KOPIUR_UID/GID=65532
          # (ks.yaml) stays anchored to a real in-repo value and can't drift on a
          # chart bump. fsGroup remaps restored data on mount as a fallback.
          # NOTE: this must live under each controller's pod.securityContext, not
          # defaultPodOptions — the chart ships per-controller securityContext and
          # defaultPodOptionsStrategy=overwrite, so a defaultPodOptions value would
          # be silently dropped.
          securityContext: &podSecurityContext
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            env:
              MEMINI_BACKEND: sqlite
              MEMINI_LOG_FORMAT: json
              # Through the proxy rather than the llmkube Services, so this
              # traffic carries a virtual key and lands in litellm's spend logs.
              MEMINI_EMBED_BASE_URL: &litellm http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_EMBED_MODEL: llmkube/Qwen/Qwen3-Embedding-0.6B
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_MAX_CONCURRENCY: "2"
              MEMINI_EMBED_API_KEY: &litellmKey
                valueFrom:
                  secretKeyRef:
                    name: memini-litellm-key
                    key: OPENAI_API_KEY
              # A base URL (not "off"/"llm") selects cross-encoder rerank;
              # memini appends /rerank, which litellm serves.
              MEMINI_RERANK: *litellm
              MEMINI_RERANK_MODEL: llmkube/Qwen/Qwen3-Reranker-0.6B
              MEMINI_RERANK_API_KEY: *litellmKey
              # The embedding model name is recorded in the store and memini
              # refuses to boot when it changes. Only the name moved here — the
              # proxy fronts the same model at the same dims — so let it
              # re-embed once instead of hand-running `memini reembed`.
              MEMINI_REEMBED_ON_MODEL_CHANGE: "true"
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
            # The chart ships liveness/readiness but no startupProbe, so its
            # ~50s liveness budget is the whole grace period — too tight for a
            # boot that re-embeds the store (MEMINI_REEMBED_ON_MODEL_CHANGE
            # above blocks the listener until it finishes).
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  # An hour. The re-embed is not resumable — it redoes every
                  # namespace and only records the new model name after a
                  # complete pass — so a probe kill mid-pass crashloops forever
                  # rather than picking up where it left off.
                  failureThreshold: 360
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # The chart's fsck cronjob is disabled by default (not rendered today).
      # Pre-pin it to the same uid/gid so that if it's ever enabled — it can
      # touch the RWO PVC — it can't drift from the main pod or restore mover.
      fsck:
        pod:
          securityContext: *podSecurityContext
    persistence:
      data:
        existingClaim: *app
      # The container's root filesystem is read-only, and ncruces/go-sqlite3
      # opens SQLite's spill files under $SQLITE_TMPDIR or /tmp — so any query
      # that sorts to disk (the startup re-embed's namespace listing, `memini
      # doctor`) dies as "disk I/O error", which is IOERR_GETTEMPPATH.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      ui:
        enabled: true
        hostnames:
          - "memini.${DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
