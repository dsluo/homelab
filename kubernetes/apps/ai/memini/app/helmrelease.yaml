---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    fullnameOverride: *app
    controllers:
      main:
        # The chart defaults to a StatefulSet for sqlite's PVC; on postgres the
        # pod holds nothing.
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Per-controller, not defaultPodOptions: the chart ships a
          # securityContext on its fsck controller with
          # defaultPodOptionsStrategy=overwrite, so a shared default is dropped.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
        containers:
          main:
            env:
              MEMINI_BACKEND: postgres
              MEMINI_POSTGRES_DSN:
                valueFrom:
                  secretKeyRef:
                    name: memini-postgres-secret
                    key: uri
              MEMINI_LOG_FORMAT: json
              # Through the proxy rather than the llmkube Services, so this
              # traffic carries a virtual key and lands in litellm's spend logs.
              MEMINI_EMBED_BASE_URL: &litellm http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_EMBED_MODEL: llmkube/Qwen/Qwen3-Embedding-0.6B
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_MAX_CONCURRENCY: "2"
              MEMINI_EMBED_API_KEY: &litellmKey
                valueFrom:
                  secretKeyRef:
                    name: memini-litellm-key
                    key: OPENAI_API_KEY
              # A base URL (not "off"/"llm") selects cross-encoder rerank;
              # memini appends /rerank, which litellm serves.
              MEMINI_RERANK: *litellm
              MEMINI_RERANK_MODEL: llmkube/Qwen/Qwen3-Reranker-0.6B
              MEMINI_RERANK_API_KEY: *litellmKey
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
            # The chart ships liveness/readiness but no startupProbe, so its
            # ~50s liveness budget is the whole grace period — too tight for a
            # first boot that has to run the schema migration, which builds the
            # vchordrq index.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      data:
        enabled: false
      # The chart's container runs with a read-only root filesystem.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      ui:
        enabled: true
        hostnames:
          - "memini.${DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
