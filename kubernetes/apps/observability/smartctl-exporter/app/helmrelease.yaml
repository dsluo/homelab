---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: smartctl-exporter
  interval: 1h
  values:
    serviceMonitor:
      enabled: true
      # matches the exporter's 120s smartctl cache; faster scrapes just repeat samples
      interval: 120s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance

    prometheusRules:
      enabled: true
      rules:
        smartCTLDeviceWearHigh:
          enabled: true
          alert: SmartCTLDeviceWearHigh
          expr: smartctl_device_percentage_used > 80
          for: 1h
          annotations:
            summary: Device is nearing its rated endurance
            description: Device {{ $labels.device }} on instance {{ $labels.instance }} has used {{ $value }}% of its rated endurance
          labels:
            severity: warning

    rbac:
      create: false

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
