---
# Shared by every OIDC-gated MCP proxy in this namespace: MCPOIDCConfig is
# namespace-scoped and can only be referenced from `ai`. Per-server values
# (audience, resourceUrl) live on each proxy's oidcConfigRef, not here.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: pocket-id
spec:
  type: inline
  inline:
    issuer: https://pocket-id.${DOMAIN}
    # CoreDNS rewrites this hostname to pocket-id's ClusterIP, and ToolHive
    # refuses to fetch OIDC endpoints that resolve to a private address — so
    # without this it never retrieves the JWKS and rejects every token. Despite
    # the name it covers discovery and introspection too, not just JWKS.
    jwksAllowPrivateIP: true
