---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/external-secrets/external-secrets/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: external-secrets
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
spec:
  dependsOn:
    - name: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: onepassword
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: cluster-secrets-source
      namespace: external-secrets
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: cluster-secrets-fanout
    - apiVersion: external-secrets.io/v1
      kind: ClusterExternalSecret
      name: cluster-secrets
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: ai
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: ai-sandbox
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: cert-manager
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: database
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: default
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: documents
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: finance
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: flux-system
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: games
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: kopiur-system
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: kube-system
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: maker
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: media
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: network
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: observability
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: openebs-system
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: security
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: social
    - apiVersion: v1
      kind: Secret
      name: cluster-secrets
      namespace: system-upgrade
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: external-secrets.io/v1
      kind: ClusterExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/external-secrets/external-secrets/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: external-secrets
  timeout: 5m
