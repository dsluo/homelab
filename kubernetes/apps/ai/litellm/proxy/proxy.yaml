---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:v1.97.0@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
  replicas: 1

  # Pushes model_list to the admin API instead of config.yaml, so the proxy does
  # not roll when the model set changes. qwen3-8-27b-mtp is gpu-preemptible and
  # its endpoint churns by design; in file mode each eviction would restart the
  # proxy and drop in-flight requests to the other models.
  applyMode: api
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY

  # No modelSelector: adopts every LiteLLMModel in ai, all of them generated by
  # the operator from the llmkube InferenceServices. No hand-written models.
  #
  # Known gap: auto-registration emits params.model as openai/<modelRef>, and
  # litellm's rerank dispatch has no openai branch, so qwen3-reranker-0-6b is
  # published but raises on /v1/rerank. Nothing calls it — memini reaches the
  # llama.cpp reranker directly. To fix, add a hand-written LiteLLMModel of the
  # same name using hosted_vllm/<name>; the operator skips same-named models it
  # does not own, so it shadows the generated one.

  env:
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_MASTER_KEY
    # Encrypts provider credentials at rest. Set once, never rotate — changing
    # it makes every already stored credential undecryptable.
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_SALT_KEY

    # litellm assembles DATABASE_URL from these itself. Split vars, not a single
    # URL, so the CNPG basic-auth Secret is consumed as-is instead of a
    # hand-written copy of the password that rots when CNPG rotates the role.
    - name: DATABASE_HOST
      value: postgres-rw.database.svc.cluster.local:5432
    - name: DATABASE_NAME
      value: litellm
    - name: DATABASE_USERNAME
      valueFrom:
        secretKeyRef:
          name: litellm-postgres-secret
          key: username
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: litellm-postgres-secret
          key: password

  # The entrypoint runs `prisma migrate deploy` (~30 tables on a fresh DB)
  # before the server binds, which outlasts the operator's default liveness
  # probe (~40s to first kill). The CRD has no startupProbe, so the grace has to
  # come from a slack failureThreshold here instead.
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

  route:
    hostnames:
      - "litellm.${SECRET_DOMAIN}"
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
