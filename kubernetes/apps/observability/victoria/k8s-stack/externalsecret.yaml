---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-token
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homeassistant-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      mergePolicy: Replace
      data:
        token: '{{ index . "token" }}'
  dataFrom:
    - extract:
        key: k8s-observability-homeassistant-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notifiers
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-notifiers
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      mergePolicy: Replace
      data:
        pushover_user_key: '{{ index . "pushover_user_key" }}'
        pushover_token: '{{ index . "pushover_token" }}'
        discord_webhook_url: '{{ index . "discord_webhook_url" }}'
  dataFrom:
    - extract:
        key: k8s-observability-alertmanager
