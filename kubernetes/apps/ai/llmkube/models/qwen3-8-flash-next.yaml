---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8-flash-next
spec:
  # Radiance's own container (int8 trunk, 4-bit experts, MTP), 114 GiB. Pinned
  # to an HF commit so a re-upload cannot drift from the image version.
  source: https://huggingface.co/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/resolve/8267a67384583f6be309981baf878b09ff900a9a/qwen3.8-next-flash-fp8-iq4r-moe.rad
  sourceSecretRef:
    name: llmkube-hf-secret
  format: custom
  quantization: IQ4R
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      count: 2
      vendor: amd
      runtime: rocm
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: r9700-x2
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-flash-next
  annotations:
    # Radiance has no /slots; without this the generic runtime has no idle
    # probe and the ModelPool never swaps away from it.
    inference.llmkube.dev/idle-metric: vllm:num_requests_running
spec:
  modelRef: qwen3-8-flash-next
  runtime: generic
  stageModel: true
  image: docker.io/stilldeadcode/radiance:1.13.0@sha256:78cf0d6a5f760d9d5e462d8eb37fe11f25ef59f10c843158e19d0cdb06990a84
  priorityClassName: gpu-preemptible

  command:
    - /opt/radiance/bin/radiance
  args:
    - --model
    - $(LLMKUBE_MODEL_PATH)
    # Must equal the ModelRouter backend name llm-gateway forwards.
    - --served-model-name
    - qwen3-8-flash-next
    - --host
    - "::"
    - --port
    - "8080"
    - --tp
    - "2"
    - --tp-wire
    - exact
    - --max-num-seqs
    - "8"
    - --max-model-len
    - "262144"
    - --placement
    - expert_tiered
    # Pinned per card, so 2x this is locked RAM the kernel cannot reclaim.
    # talos1 has 62 GiB; Radiance's recipe uses 12288 on bigger hosts.
    - --host-pool-mib
    - "8192"
    - --gpu-headroom-mib
    - "160"
    # The 47.7 GiB n-gram table is read from the container through a row
    # cache; "ram" would pin a copy talos1 cannot spare.
    - --ngram-placement
    - disk
    - --embedding-placement
    - ram
    - --kv-cache-dtype
    - fp8
    - --num-speculative-tokens
    - "4"
    - --draft-window
    - "adaptive"
    - --draft-coupling
    - "off"
    - --max-num-batched-tokens
    - "4096"
    - --prefill-span
    - "2"
    - --prefix-cache-mib
    - "8192"
    # In VRAM the 857 MiB/card tower comes out of the KV cache.
    - --vision-tower-placement
    - ram

  # RuntimeDefault refuses io_uring (the n-gram reads) and ROCm's NUMA calls.
  # The profile is a talos1 machine-config file (talos/patches/node/talos1/).
  # An explicit podSecurityContext replaces the operator's, so restate its cache group.
  podSecurityContext:
    fsGroup: 102
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/radiance.json
  # io_uring rings count against RLIMIT_MEMLOCK (8 MiB) per UID, and root's
  # share is already spent by other root processes on talos1. A UID of its own
  # gets a fresh 8 MiB. Container-level so the cache-prep init still runs as root.
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false

  resources:
    cpu: "8"
    # ~35.6 GiB is pinned at startup at fixed sizes (the vision tower is
    # 857 MiB of it) and usage sits near 37.5 GiB. Pinned memory counts against
    # the limit and is never reclaimed, so the limit is the OOM margin.
    # --embedding-placement ram refuses to start unless it leaves 4 GiB free
    # after those pins.
    memory: 40Gi
    memoryLimit: 48Gi
    gpu: 2

  probeOverrides:
    # A cold start reads 114 GiB off the cache PVC.
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 180
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10

  endpoint:
    port: 8080
    path: /v1/chat/completions
    type: ClusterIP
