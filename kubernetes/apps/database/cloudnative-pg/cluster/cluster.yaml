---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 1
  # single instance on node-local storage: the PDB can never be satisfied (no
  # failover target), so it would deadlock node drains during tuppr upgrades.
  enablePDB: false
  # Must stay fully qualified: bare tags (:18) are the deprecated bullseye
  # line, removed at its EOL, and they hide the PostgreSQL minor version.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c2a773217853c6e0ffe7da9c37ea456466efb20cf844f27511a73fa6a81e3152

  primaryUpdateStrategy: unsupervised
  # switch to switchover when instances > 1
  primaryUpdateMethod: restart

  storage:
    storageClass: openebs-hostpath
    size: 20Gi

  managed:
    services:
      # we're single node anyway
      disabledDefaultServices: ["ro"]
    roles:
      # app stays inline: it's the bootstrap database owner, not a login role.
      # Per-app login roles are DatabaseRole resources created by
      # components/database in each consuming app's Kustomization.
      - name: &default app
        login: false

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        # WALs + primary (PITR-capable) base backups go to Backblaze B2.
        barmanObjectName: backblaze

  bootstrap:
    # initdb:
    #   database: *default
    #   owner: *default
    recovery:
      database: *default
      owner: *default
      source: backblaze

  externalClusters:
    # recovery.source picks one of these; the others are just available targets
    # to flip to (e.g. recover from garage before B2 has its first backup).
    - name: backblaze
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backblaze
          serverName: postgres
    - name: garage
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage
          serverName: postgres

  # Headroom for kguardian, whose flow ingest and the autovacuum behind it are
  # the heaviest tenant here — upstream sizes a kguardian-only Postgres at the
  # 1Gi this whole cluster used to have. An OOMKill takes every app's database
  # with it, so the limit is set above observed use rather than at it.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

  postgresql:
    # VectorChord (memini's vector store) is an index AM: it has to be preloaded
    # to be creatable at all, so this is cluster-wide even though one tenant uses
    # it. The extension image ships only the .so and control file — pgvector,
    # which vchord builds on, comes from the base image.
    shared_preload_libraries:
      - vchord
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/

  monitoring:
    enablePodMonitor: true
