---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: 10.96.0.10
    replicaCount: 2
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          # Disabled: autopath's answer for the first search suffix is cached
          # on whichever replica served it, so the two replicas disagree and
          # Go's parallel A/AAAA queries can land on different ones — yielding
          # a v6-only address, undialable on this IPv4-only pod network.
          # todo: re-enable once the cluster is dual-stack — a v6-only answer
          # dials fine there.
          # - name: autopath
          #   parameters: "@kubernetes"
          # Split-horizon for the IdP. Without this, in-cluster OIDC clients
          # resolve pocket-id via k8s-gateway to the envoy-cloudflare VIP, so
          # every one of them needs an egress rule allowing those gateway pods
          # — which transitively grants it every route behind that gateway.
          # Sending the name straight at the Service makes `toServices` on
          # pocket-id the whole allowance. External resolution is unaffected:
          # it never passes through here.
          #
          # Placement is cosmetic — CoreDNS orders plugins by its own build,
          # and rewrite always runs before kubernetes/forward.
          - name: rewrite
            parameters: stop
            configBlock: |-
              name exact pocket-id.${DOMAIN} pocket-id.security.svc.cluster.local
              answer auto
          - name: forward
            parameters: ${DOMAIN} 10.0.42.128
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    # todo: if the cluster becomes all-control-plane (or gains more CP nodes),
    # revisit — a `required` control-plane affinity is fine there and the
    # podAntiAffinity below can be relaxed.
    affinity:
      # prefer (not require) control-plane: with one CP node a `required` rule
      # collapses both replicas onto talos0, killing DNS during its reboot.
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
      # keep the two replicas on separate nodes for real HA across reboots
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: coredns
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
