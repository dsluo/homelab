---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
spec:
  # CreatedOnce: the generator mints a new password on every refresh.
  refreshPolicy: CreatedOnce
  target:
    name: kritika-postgres-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: kritika
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      mergePolicy: Replace
      data:
        username: kritika_app
        password: '{{ index . "password" }}'
        # The shared cluster allows 100 connections and other apps hold about
        # half; each replica's app pool would otherwise grow to 16.
        uri: 'postgres://kritika_app:{{ index . "password" }}@postgres-rw.database.svc.cluster.local:5432/kritika?connect_timeout=10&pool_max_conns=6'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: postgres-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-runner
spec:
  # CreatedOnce: the generator mints a new password on every refresh.
  refreshPolicy: CreatedOnce
  target:
    name: kritika-postgres-runner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: kritika
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      mergePolicy: Replace
      data:
        username: kritika_runner
        password: '{{ index . "password" }}'
        uri: 'postgres://kritika_runner:{{ index . "password" }}@postgres-rw.database.svc.cluster.local:5432/kritika?connect_timeout=10'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: postgres-password
