---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${DB_APP}-postgres-secret
spec:
  # CreatedOnce, not Periodic: the generator mints a fresh password on every
  # refresh, which would silently rotate the role out from under the app. It
  # freezes the whole template too — editing the keys below only affects
  # databases created afterwards, so a shape change means deleting each
  # existing Secret to let it be regenerated.
  refreshPolicy: CreatedOnce
  target:
    name: ${DB_APP}-postgres-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: ${DB_NAMESPACE}
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      mergePolicy: Replace
      data:
        # DatabaseRole rejects a passwordSecret missing either field; the
        # generator only supplies password.
        username: ${DB_APP}
        password: '{{ index . "password" }}'
        # For consumers that take a whole DSN rather than a password field
        # (pocket-id's operator CRD, which has no $(VAR) expansion to build one).
        # No uri_ro: the cluster sets disabledDefaultServices: ["ro"], so
        # postgres-ro does not exist — and being replicas-only it would have no
        # backends at instances: 1 anyway.
        uri: 'postgres://${DB_APP}:{{ index . "password" }}@postgres-rw.database.svc.cluster.local:5432/${DB_APP}'
        uri_r: 'postgres://${DB_APP}:{{ index . "password" }}@postgres-r.database.svc.cluster.local:5432/${DB_APP}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: postgres-password
